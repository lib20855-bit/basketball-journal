<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="篮球手记">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef1f7">
<title>Lee 的篮球空间</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f7;
  --surface: #ffffff;
  --surface2: #f4f6fb;
  --border: #dde2ee;
  --border2: #c5cce0;
  --green: #00913f;
  --green-dim: #d0f0e0;
  --green-text: #006b2e;
  --purple: #5c2fd6;
  --purple-dim: #ebe5fb;
  --purple-text: #3d1fa0;
  --orange: #d94f00;
  --orange-dim: #fde8d8;
  --orange-text: #a03a00;
  --text: #111827;
  --text2: #374151;
  --text3: #6b7280;
  --white: #111827;
  --radius: 12px;
  --radius-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── NOISE OVERLAY ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: none;
  pointer-events: none;
  z-index: 0;
}

/* ── HERO ── */
.hero {
  position: relative;
  padding: 2rem 1.25rem 1.75rem;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  background: var(--surface);
}
.hero::after {
  content: 'BBALL';
  position: absolute;
  right: -1rem;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14rem;
  color: rgba(0,145,63,0.06);
  pointer-events: none;
  line-height: 1;
  white-space: nowrap;
}
.hero-eyebrow {
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--green);
  font-weight: 500;
  margin-bottom: 0.75rem;
  text-transform: uppercase;
}
.hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.4rem, 10vw, 5rem);
  letter-spacing: 0.04em;
  color: var(--text);
  line-height: 0.95;
}
.hero-title span { color: var(--green); }
.hero-desc {
  margin-top: 0.875rem;
  font-size: 14px;
  color: var(--text2);
  max-width: 420px;
}
.role-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 1rem;
}
.rpill {
  font-size: 12px;
  font-weight: 500;
  padding: 5px 16px;
  border-radius: 99px;
  letter-spacing: 0.04em;
}
.rp-g { background: var(--green-dim); color: var(--green); border: 1px solid rgba(62,240,124,0.2); }
.rp-p { background: var(--purple-dim); color: var(--purple); border: 1px solid rgba(157,127,252,0.2); }
.rp-o { background: var(--orange-dim); color: var(--orange); border: 1px solid rgba(255,123,66,0.2); }

/* ── STATS ── */
.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}
.stat {
  background: var(--surface);
  padding: 1.125rem 1rem;
  text-align: center;
  transition: background 0.2s;
}
.stat:hover { background: var(--surface2); }
.stat-n {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2rem;
  color: var(--text);
  letter-spacing: 0.02em;
  line-height: 1;
}
.stat-l { font-size: 11px; color: var(--text3); margin-top: 5px; letter-spacing: 0.05em; }

/* ── NAV ── */
.view-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0.75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(238,241,247,0.97); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  z-index: 50;
}
.vnav-btn {
  font-size: 13px;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: 99px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.18s;
  font-family: 'Noto Sans SC', sans-serif;
  letter-spacing: 0.02em;
}
.vnav-btn:hover { color: var(--text); border-color: var(--border2); }
.vnav-btn.active { background: var(--surface2); color: var(--white); border-color: var(--border2); }
.vnav-sep { flex: 1; }
.add-btn {
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 99px;
  background: var(--green);
  color: #000;
  border: none;
  cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif;
  transition: opacity 0.18s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.add-btn:hover { opacity: 0.85; }

/* ── MAIN LAYOUT ── */
.main { padding: 1.25rem 1.25rem 6rem; }

/* ── SECTION HEADER ── */
.sec-hd {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.25rem;
  margin-top: 2.5rem;
}
.sec-hd:first-child { margin-top: 0; }
.sec-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sec-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.06em; color: var(--text); }
.sec-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  color: var(--text3);
  letter-spacing: 0.06em;
}
.sec-divider { height: 1px; background: var(--border); margin: 2.5rem 0; }

/* ── CARD ── */
.entries { display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--border2); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.card-body { padding: 1rem 1.125rem; }
.card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
.card-date { font-size: 13px; color: var(--text3); letter-spacing: 0.04em; }
.card-tag {
  font-size: 13px;
  font-weight: 500;
  padding: 2px 9px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}
.card-title { font-size: 17px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.card-text { font-size: 15px; color: var(--text2); line-height: 1.8; }
.card-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip {
  font-size: 13px;
  padding: 2px 9px;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--text3);
  border: 1px solid var(--border);
}

/* ── MEDIA BLOCK ── */
.media-zone {
  border-top: 1px solid var(--border);
  padding: 0.875rem 1.125rem;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.media-label { font-size: 12px; color: var(--text3); letter-spacing: 0.08em; margin-bottom: 4px; }
.media-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Video */
.vid-item {
  flex: 1;
  min-width: 180px;
  aspect-ratio: 16/9;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}
.vid-item:hover { border-color: var(--border2); }
.vid-item video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vid-placeholder { text-align: center; z-index: 1; pointer-events: none; }
.vid-play-btn {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 7px;
}
.vid-duration { font-size: 11px; color: var(--text2); }
.vid-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s; z-index: 2;
}
.vid-item:hover .vid-overlay { opacity: 1; }

/* Image */
.img-item {
  width: 80px; height: 80px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: border-color 0.2s;
}
.img-item:hover { border-color: var(--border2); }
.img-item img { width: 100%; height: 100%; object-fit: cover; }
.img-grid { display: flex; gap: 6px; flex-wrap: wrap; }

/* Audio */
.audio-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.audio-btn {
  width: 30px; height: 30px; border-radius: 50%;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: opacity 0.2s;
}
.audio-btn:hover { opacity: 0.8; }
.audio-info { flex: 1; min-width: 0; }
.audio-name { font-size: 14px; color: var(--text); font-weight: 500; }
.audio-time { font-size: 12px; color: var(--text3); margin-top: 2px; }
.audio-bar-wrap { flex: 1; min-width: 60px; }
.audio-track {
  height: 3px;
  background: var(--border2);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
}
.audio-prog { height: 3px; border-radius: 2px; width: 0%; transition: width 0.1s; }

/* Upload zones */
.upload-zone {
  border: 1px dashed var(--border2);
  border-radius: var(--radius-sm);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 11px;
  color: var(--text3);
  background: var(--surface2);
}
.upload-zone:hover { border-color: var(--text3); color: var(--text2); }
.upload-zone.drag-over { border-color: var(--green); color: var(--green); background: var(--green-dim); }
.upload-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.upl-btn {
  font-size: 12px;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  border: 1px dashed var(--border2);
  background: var(--surface2);
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s;
  font-family: 'Noto Sans SC', sans-serif;
}
.upl-btn:hover { border-color: var(--text3); color: var(--text2); }

/* ── TIMELINE VIEW ── */
.timeline { display: none; }
.timeline.active { display: block; }
.grid-view { display: block; }
.grid-view.hidden { display: none; }

.tl-year { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--text); letter-spacing: 0.06em; margin-bottom: 1.5rem; margin-top: 0.5rem; }
.tl-month-group { margin-bottom: 2rem; }
.tl-month-label {
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 1rem;
  padding-left: 1.5rem;
  position: relative;
}
.tl-month-label::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 10px;
  height: 1px;
  background: var(--border2);
}
.tl-items { display: flex; flex-direction: column; gap: 0; }
.tl-item {
  display: flex;
  gap: 0;
  padding-left: 1.5rem;
  position: relative;
}
.tl-item::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
}
.tl-item:last-child::before { bottom: 50%; }
.tl-dot {
  position: absolute;
  left: 0;
  top: 1.2rem;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  background: var(--bg);
  z-index: 1;
  flex-shrink: 0;
}
.tl-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.875rem 1rem;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.tl-card:hover { border-color: var(--border2); }
.tl-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.tl-card-date { font-size: 11px; color: var(--text3); }
.tl-card-role { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 3px; }
.tl-card-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.tl-card-text { font-size: 13px; color: var(--text2); line-height: 1.7; }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  border-radius: var(--radius);
  padding: 1.75rem;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--text); letter-spacing: 0.04em; margin-bottom: 1.25rem; }
.form-group { margin-bottom: 1rem; }
.form-label { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--text);
  font-size: 16px;
  -webkit-appearance: none;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--green); }
.form-textarea { min-height: 110px; resize: none; line-height: 1.7; }
.form-select option { background: var(--surface2); }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
.btn-cancel {
  font-size: 13px; padding: 8px 18px; border-radius: 99px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2);
  transition: all 0.18s; cursor: pointer; font-family: 'Noto Sans SC', sans-serif;
  transition: all 0.18s;
}
.btn-cancel:hover { color: var(--text); }
.btn-submit {
  font-size: 13px; padding: 8px 20px; border-radius: 99px;
  border: none; background: var(--green); color: #000;
  cursor: pointer; font-family: 'Noto Sans SC', sans-serif; font-weight: 500;
  transition: opacity 0.18s;
}
.btn-submit:hover { opacity: 0.85; }

/* ── LIGHTBOX ── */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.lightbox.open { display: flex; }
.lightbox img, .lightbox video {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: var(--radius-sm);
}
.lightbox-close {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid #444;
  background: #222;
  color: #ccc;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

/* ── FOOTER ── */
.footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border); }
.footer p { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.role-enter-btn {
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer;
  transition: opacity 0.18s, transform 0.15s;
  border: none;
}
.role-enter-btn:hover { opacity: 0.85; transform: translateY(-1px); }

.role-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 1.375rem 1.25rem;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.role-card-accent { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.role-card-name { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.06em; margin-top: 0.5rem; }
.role-card-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
.role-card-count { font-size: 12px; color: var(--text3); margin-top: 0.875rem; }

.back-btn { color: var(--text2) !important; }
.back-btn:hover { color: var(--text) !important; }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: 1.75rem;
  right: 1.25rem;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0,145,63,0.35);
  z-index: 40;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s, box-shadow 0.15s;
}
.fab:active { transform: scale(0.93); box-shadow: 0 2px 8px rgba(0,145,63,0.25); }

/* ── TOUCH TARGETS ── */
.vnav-btn { min-height: 36px; min-width: 44px; }
.upl-btn { min-height: 40px; padding: 8px 12px; }
.chip { padding: 4px 10px; }
.rpill { padding: 7px 18px; }

/* ── MODAL mobile ── */
@media (max-width: 600px) {
  .modal-overlay { align-items: flex-end; padding: 0; }
  .modal {
    border-radius: 16px 16px 0 0;
    max-height: 92vh;
    padding: 1.5rem 1.25rem 2rem;
    border-bottom: none;
  }
  .modal-title { font-size: 1.3rem; }
}

/* ── AUDIO item mobile ── */
.audio-name { font-size: 14px; font-weight: 500; }
.audio-time { font-size: 12px; color: var(--text3); margin-top: 2px; }

/* ── HORIZONTAL ROLE CARDS ── */
.role-card {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0;
  overflow: hidden;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s;
}
.role-card:active { transform: scale(0.98); }
.rcard-left {
  width: 72px;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  align-self: stretch;
}
.rcard-icon {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  letter-spacing: 0.06em;
  writing-mode: horizontal-tb;
  font-size: 1.1rem;
}
.rcard-right {
  flex: 1;
  padding: 0.875rem 0.875rem 0.875rem 1rem;
  min-width: 0;
}
.rcard-title { font-size: 16px; font-weight: 500; margin-bottom: 3px; }
.rcard-desc { font-size: 12px; color: var(--text3); line-height: 1.5; }
.rcard-count { font-size: 12px; color: var(--text3); margin-top: 8px; }
.rcard-arrow {
  font-size: 22px;
  color: var(--border2);
  padding-right: 1rem;
  flex-shrink: 0;
  font-weight: 300;
}

/* ── CARD ACTIONS ── */
.card-meta { position: relative; }
.card-actions {
  margin-left: auto;
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.15s;
}
.card:hover .card-actions, .card:focus-within .card-actions { opacity: 1; }
@media (max-width: 768px) { .card-actions { opacity: 1; } }
.card-action-btn {
  width: 30px; height: 30px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s;
}
.card-action-btn:hover, .card-action-btn:active { background: var(--surface2); color: var(--text); }
.card-delete-btn:hover, .card-delete-btn:active { background: #fdeade; color: var(--orange); }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">

<script>
const roleColors = {
  player: { accent: 'var(--green)', dim: 'var(--green-dim)', text: 'var(--green)', label: '球员' },
  coach:  { accent: 'var(--purple)', dim: 'var(--purple-dim)', text: 'var(--purple)', label: '教练' },
  ref:    { accent: 'var(--orange)', dim: 'var(--orange-dim)', text: 'var(--orange)', label: '裁判' }
};

// ── STORAGE ──
const STORE_KEY = 'bball_entries_v1';
const MEDIA_KEY = 'bball_media_v1';

function loadEntries() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e) { return []; }
}
function saveEntries() {
  // save from source containers ONLY, never from display area
  const entries = [];
  ['player','coach','ref'].forEach(role => {
    document.getElementById('entries-'+role).querySelectorAll('.card[data-role]').forEach(card => {
      entries.push({
        id:    card.dataset.id || '',
        role:  card.dataset.role,
        date:  card.dataset.date || '',
        title: card.querySelector('.card-title')?.textContent || '',
        text:  card.querySelector('.card-text')?.textContent || '',
        tag:   card.querySelector('.card-tag')?.textContent || '',
        chips: Array.from(card.querySelectorAll('.chip')).map(c => c.textContent),
      });
    });
  });
  try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); } catch(e) {}
}
function loadMediaIndex() {
  try { return JSON.parse(localStorage.getItem(MEDIA_KEY) || '{}'); } catch(e) { return {}; }
}
function saveMediaIndex(idx) {
  try { localStorage.setItem(MEDIA_KEY, JSON.stringify(idx)); } catch(e) {}
}

// ── RENDER SAVED ENTRIES ──
function renderSavedEntries() {
  const entries = loadEntries();
  entries.forEach(e => {
    const rc = roleColors[e.role];
    if(!rc) return;
    const fmtDate = (e.date||'').replace(/-/g,' · ');
    const chipHtml = (e.chips||[]).map(c=>`<span class="chip">${c}</span>`).join('');
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.role = e.role;
    card.dataset.date = e.date || '';
    card.dataset.id = e.id || Date.now() + Math.random();
    card.innerHTML = buildCardInner(e.role, fmtDate, e.tag, e.title, e.text, chipHtml);
    attachMediaUploadHandlers(card);
    const container = document.getElementById(`entries-${e.role}`);
    if(container) container.appendChild(card);
    restoreMediaForCard(card);
  });
}

function buildCardInner(role, fmtDate, tag, title, text, chipHtml) {
  const rc = roleColors[role];
  return `
    <div class="card-body">
      <div class="card-meta">
        <span class="card-date">${fmtDate}</span>
        ${tag ? `<span class="card-tag" style="background:${rc.dim};color:${rc.accent}">${tag}</span>` : ''}
        <div class="card-actions">
          <button class="card-action-btn" onclick="editCard(this.closest('.card'))" title="编辑">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          </button>
          <button class="card-action-btn card-delete-btn" onclick="deleteCard(this.closest('.card'))" title="删除">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3 4l.8 7.5h6.4L11 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="card-title">${title}</div>
      <div class="card-text">${text}</div>
      ${chipHtml ? `<div class="card-chips">${chipHtml}</div>` : ''}
    </div>
    <div class="media-zone">
      <div class="media-label">媒体</div>
      <div class="upload-btns">
        <label class="upl-btn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1"/><path d="M4 5l2-2 2 2M6 3v4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          拍视频 / 选文件
          <input type="file" accept="video/*" capture="environment" style="display:none" onchange="handleMedia(this,'video',this.closest('.card'))">
        </label>
        <label class="upl-btn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1"/><circle cx="4" cy="5" r="1" fill="currentColor"/><path d="M1 9l3-3 2 2 2-2 3 3" stroke="currentColor" stroke-width="1" fill="none"/></svg>
          拍照 / 选图片
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="handleMedia(this,'image',this.closest('.card'))">
        </label>
        <label class="upl-btn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="5" r="2.5" stroke="currentColor" stroke-width="1"/><path d="M3 10c0-1.7 1.3-3 3-3s3 1.3 3 3" stroke="currentColor" stroke-width="1"/><path d="M6 7.5v2" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          录音 / 选音频
          <input type="file" accept="audio/*" style="display:none" onchange="handleMedia(this,'audio',this.closest('.card'))">
        </label>
      </div>
      <div class="media-row" style="margin-top:4px"></div>
    </div>`;
}

function attachMediaUploadHandlers(card) {
  card.querySelectorAll('input[type=file]').forEach(input => {
    const type = input.accept.includes('video') ? 'video' : input.accept.includes('image') ? 'image' : 'audio';
    input.onchange = function() { handleMedia(this, type, this.closest('.card')); };
  });
}

// ── MEDIA PERSISTENCE (base64 for images/audio, skip video) ──
function getCardId(card) {
  if(!card.dataset.id) card.dataset.id = Date.now() + '_' + Math.random().toString(36).slice(2);
  return card.dataset.id;
}
function restoreMediaForCard(card) {
  const idx = loadMediaIndex();
  const id = card.dataset.id;
  if(!id || !idx[id]) return;
  const row = card.querySelector('.media-row');
  idx[id].forEach(m => {
    if(m.type === 'image') {
      const wrap = document.createElement('div');
      wrap.className = 'img-item';
      const img = document.createElement('img');
      img.src = m.data;
      wrap.appendChild(img);
      wrap.onclick = () => openLightbox('img', m.data);
      row.appendChild(wrap);
    } else if(m.type === 'audio') {
      renderAudioItem(row, m.name, m.data);
    }
  });
}
function persistMedia(card, type, name, data) {
  const id = getCardId(card);
  const idx = loadMediaIndex();
  if(!idx[id]) idx[id] = [];
  if(type !== 'video') {
    idx[id].push({ type, name, data });
    saveMediaIndex(idx);
  }
}

// ── STATS ──
function updateStats() {
  // only count from source containers, never from display area
  const p = document.getElementById('entries-player').querySelectorAll('.card[data-role]').length;
  const c = document.getElementById('entries-coach').querySelectorAll('.card[data-role]').length;
  const r = document.getElementById('entries-ref').querySelectorAll('.card[data-role]').length;
  document.getElementById('cnt-player').textContent = p;
  document.getElementById('cnt-coach').textContent = c;
  document.getElementById('cnt-ref').textContent = r;
  document.getElementById('cnt-total').textContent = p+c+r;
}

// ── INIT ──
renderSavedEntries();
if(!localStorage.getItem(STORE_KEY)) saveEntries();
updateStats();
updateHomeCount();

// ── ROLE NAVIGATION ──
let currentRole = null;

function enterRole(role) {
  currentRole = role;
  const rc = roleColors[role];
  const roleNames = { player: '练球日志', coach: '教练手记', ref: '裁判笔记' };

  document.getElementById('home-view').style.display = 'none';
  document.getElementById('role-view').style.display = 'block';
  document.getElementById('role-nav').style.display = 'flex';
  document.getElementById('fab-btn').style.display = 'flex';
  document.getElementById('role-nav-title').textContent = roleNames[role];
  document.getElementById('role-nav-title').style.color = rc.accent;
  document.getElementById('tab-entries').classList.add('active');
  document.getElementById('tab-timeline').classList.remove('active');

  renderRoleEntries(role);
  window.scrollTo(0, 0);
}

function exitRole() {
  currentRole = null;
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('role-view').style.display = 'none';
  document.getElementById('role-nav').style.display = 'none';
  document.getElementById('fab-btn').style.display = 'none';
  updateHomeCount();
}

function renderRoleEntries(role) {
  // sync store from source containers (not display)
  syncStoreFromDOM();

  const display = document.getElementById('role-entries-display');
  const empty = document.getElementById('role-empty');
  const tlDisplay = document.getElementById('role-timeline-display');

  display.style.display = 'flex';
  tlDisplay.style.display = 'none';
  display.innerHTML = '';

  // get entries for this role from store, sorted newest first
  const entries = Object.values(entryStore)
    .filter(e => e.role === role)
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));

  if(entries.length === 0) {
    empty.style.display = 'block';
    display.style.display = 'none';
    return;
  }
  empty.style.display = 'none';

  entries.forEach(e => {
    const rc = roleColors[e.role];
    const fmtDate = (e.date||'').replace(/-/g,' · ');
    const chipHtml = (e.chips||[]).map(c=>`<span class="chip">${c}</span>`).join('');
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.role = e.role;
    card.dataset.date = e.date || '';
    card.dataset.id = e.id;
    card.innerHTML = buildCardInner(e.role, fmtDate, e.tag, e.title, e.text, chipHtml);
    attachMediaUploadHandlers(card);
    restoreMediaForCard(card);
    display.appendChild(card);
  });
}

function switchTab(tab) {
  document.getElementById('tab-entries').classList.toggle('active', tab === 'entries');
  document.getElementById('tab-timeline').classList.toggle('active', tab === 'timeline');
  const display = document.getElementById('role-entries-display');
  const tlDisplay = document.getElementById('role-timeline-display');
  const empty = document.getElementById('role-empty');

  if(tab === 'timeline') {
    display.style.display = 'none';
    tlDisplay.style.display = 'block';
    empty.style.display = 'none';
    buildRoleTimeline(currentRole);
  } else {
    tlDisplay.style.display = 'none';
    renderRoleEntries(currentRole);
  }
}

function buildRoleTimeline(role) {
  const src = document.getElementById('entries-' + role);
  const cards = Array.from(src.querySelectorAll('.card[data-role]'));
  const tlDisplay = document.getElementById('role-timeline-display');
  if(!cards.length) { tlDisplay.innerHTML = '<p style="color:var(--text3);font-size:13px;padding:2rem 0">还没有记录</p>'; return; }
  const byMonth = {};
  cards.forEach(card => {
    const d = card.dataset.date || '2024-01-01';
    const [y,m] = d.split('-');
    const key = `${y}-${m}`;
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(card);
  });
  const months = Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
  const monthNames = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const rc = roleColors[role];
  let html = '';
  let lastYear = '';
  months.forEach(key => {
    const [y,m] = key.split('-');
    if(y !== lastYear) { html += `<div class="tl-year">${y}</div>`; lastYear = y; }
    html += `<div class="tl-month-group"><div class="tl-month-label">${monthNames[parseInt(m)]||m}</div><div class="tl-items">`;
    byMonth[key].forEach(card => {
      const title = card.querySelector('.card-title')?.textContent || '';
      const text = card.querySelector('.card-text')?.textContent || '';
      const date = (card.dataset.date||'').replace(/-/g,' · ');
      html += `<div class="tl-item">
        <div class="tl-dot" style="border-color:${rc.accent}"></div>
        <div class="tl-card">
          <div class="tl-card-top"><span class="tl-card-date">${date}</span></div>
          <div class="tl-card-title">${title}</div>
          <div class="tl-card-text">${text.substring(0,100)}${text.length>100?'…':''}</div>
        </div>
      </div>`;
    });
    html += '</div></div>';
  });
  tlDisplay.innerHTML = html;
}

function updateHomeCount() {
  ['player','coach','ref'].forEach(role => {
    const n = document.getElementById('entries-'+role).querySelectorAll('.card[data-role]').length;
    const el = document.getElementById('home-cnt-'+role);
    if(el) el.textContent = n + ' 条记录';
  });
}

// ── TIMELINE ──
function buildTimeline() {
  const cards = Array.from(document.querySelectorAll('.card[data-role]'));
  if(!cards.length) { document.getElementById('timeline-content').innerHTML = '<p style="color:var(--text3);font-size:13px">暂无记录</p>'; return; }
  const byMonth = {};
  cards.forEach(card => {
    const d = card.dataset.date || '2024-01-01';
    const [y,m] = d.split('-');
    const key = `${y}-${m}`;
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(card);
  });
  const months = Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
  const monthNames = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  let html = '';
  let lastYear = '';
  months.forEach(key => {
    const [y,m] = key.split('-');
    if(y !== lastYear) { html += `<div class="tl-year">${y}</div>`; lastYear = y; }
    const monthLabel = monthNames[parseInt(m)] || m;
    html += `<div class="tl-month-group"><div class="tl-month-label">${monthLabel}</div><div class="tl-items">`;
    byMonth[key].forEach(card => {
      const role = card.dataset.role;
      const rc = roleColors[role];
      const title = card.querySelector('.card-title')?.textContent || '';
      const text = card.querySelector('.card-text')?.textContent || '';
      const date = (card.dataset.date||'').replace(/-/g,' · ');
      html += `<div class="tl-item">
        <div class="tl-dot" style="border-color:${rc.accent}"></div>
        <div class="tl-card">
          <div class="tl-card-top">
            <span class="tl-card-date">${date}</span>
            <span class="tl-card-role" style="background:${rc.dim};color:${rc.accent}">${rc.label}</span>
          </div>
          <div class="tl-card-title">${title}</div>
          <div class="tl-card-text">${text.substring(0,80)}${text.length>80?'…':''}</div>
        </div>
      </div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('timeline-content').innerHTML = html;
}

// ── MODAL ──
function openModal() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('f-date').value = today;
  if(currentRole) document.getElementById('f-role').value = currentRole;
  updateTagHints(currentRole || 'player');
  document.getElementById('modal-overlay').classList.add('open');
}

const TAG_HINTS = {
  player: ['投篮训练','运球训练','对抗训练','体能训练','健身','拉伸恢复','实战'],
  coach:  ['战术设计','训练设计','球员发展','赛后复盘','技术指导'],
  ref:    ['规则思考','执裁总结','争议判罚','赛前准备'],
};

function updateTagHints(role) {
  const hints = TAG_HINTS[role] || [];
  const container = document.getElementById('f-tag-hints');
  if(!container) return;
  container.innerHTML = hints.map(h =>
    `<button type="button" onclick="setTag('${h}')" style="font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border2);background:var(--surface2);color:var(--text3);cursor:pointer;font-family:inherit;-webkit-tap-highlight-color:transparent">${h}</button>`
  ).join('');
}

function setTag(val) {
  document.getElementById('f-tag').value = val;
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  delete document.getElementById('modal-overlay').dataset.editId;
  document.getElementById('modal-title').textContent = '新建记录';
  ['f-tag','f-title','f-text','f-chips'].forEach(id => document.getElementById(id).value = '');
}

// ── EDIT CARD ──
// ── IN-MEMORY ENTRY STORE (single source of truth) ──
let entryStore = {}; // id -> {id, role, date, tag, title, text, chips:[]}

function syncStoreFromDOM() {
  entryStore = {};
  ['player','coach','ref'].forEach(r => {
    document.getElementById('entries-'+r).querySelectorAll('.card[data-role]').forEach(card => {
      const id = card.dataset.id;
      if(!id) return;
      entryStore[id] = {
        id,
        role: card.dataset.role,
        date: card.dataset.date || '',
        tag:   card.querySelector('.card-tag')?.textContent || '',
        title: card.querySelector('.card-title')?.textContent || '',
        text:  card.querySelector('.card-text')?.textContent || '',
        chips: Array.from(card.querySelectorAll('.chip')).map(c=>c.textContent),
      };
    });
  });
}

function editCard(card) {
  // always read from store, not from DOM clone
  syncStoreFromDOM();
  const id = card.dataset.id;
  const entry = entryStore[id];
  if(!entry) return;

  document.getElementById('f-date').value = entry.date;
  document.getElementById('f-role').value = entry.role;
  document.getElementById('f-tag').value = entry.tag;
  document.getElementById('f-title').value = entry.title;
  document.getElementById('f-text').value = entry.text;
  document.getElementById('f-chips').value = entry.chips.join(', ');

  document.getElementById('modal-overlay').dataset.editId = id;
  document.getElementById('modal-title').textContent = '编辑记录';
  document.getElementById('modal-overlay').classList.add('open');
}

// ── DELETE CARD ──
function deleteCard(card) {
  if(!confirm('确认删除这条记录？')) return;
  const id = card.dataset.id;
  const role = card.dataset.role;

  // remove from source container only (display will refresh)
  ['player','coach','ref'].forEach(r => {
    document.getElementById('entries-'+r).querySelectorAll(`[data-id="${id}"]`).forEach(c => c.remove());
  });

  // remove media
  const idx = loadMediaIndex();
  delete idx[id];
  saveMediaIndex(idx);

  saveEntries();
  updateStats();
  updateHomeCount();
  if(currentRole) renderRoleEntries(currentRole);
  showSaveToast();
}

function submitEntry() {
  const date  = document.getElementById('f-date').value;
  const role  = document.getElementById('f-role').value;
  const tag   = document.getElementById('f-tag').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const text  = document.getElementById('f-text').value.trim();
  const chips = document.getElementById('f-chips').value.trim();
  if(!title||!text) { alert('请填写标题和内容'); return; }

  const fmtDate  = date.replace(/-/g,' · ');
  const chipHtml = chips ? chips.split(',').map(c=>`<span class="chip">${c.trim()}</span>`).join('') : '';
  const editId   = document.getElementById('modal-overlay').dataset.editId;

  if(editId) {
    // ── EDIT: remove old card from ALL source containers, insert updated one ──
    ['player','coach','ref'].forEach(r => {
      document.getElementById('entries-'+r).querySelectorAll(`[data-id="${editId}"]`).forEach(c => c.remove());
    });
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.role = role;
    card.dataset.date = date;
    card.dataset.id   = editId;
    card.innerHTML = buildCardInner(role, fmtDate, tag, title, text, chipHtml);
    attachMediaUploadHandlers(card);
    restoreMediaForCard(card);
    document.getElementById('entries-' + role).prepend(card);
  } else {
    // ── NEW ENTRY ──
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.role = role;
    card.dataset.date = date;
    card.dataset.id   = Date.now() + '_' + Math.random().toString(36).slice(2);
    card.innerHTML = buildCardInner(role, fmtDate, tag, title, text, chipHtml);
    attachMediaUploadHandlers(card);
    document.getElementById('entries-' + role).prepend(card);
  }

  saveEntries();
  closeModal();
  updateStats();
  updateHomeCount();
  if(currentRole) renderRoleEntries(currentRole);
  showSaveToast();
}

// ── MEDIA UPLOAD ──
// ── MEDIA UPLOAD ──
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function renderAudioItem(row, name, src) {
  const wrap = document.createElement('div');
  wrap.className = 'audio-item';
  wrap.style.width = '100%';
  const audio = new Audio(src);
  const uid = 'at-' + Date.now() + Math.random().toString(36).slice(2);
  wrap.innerHTML = `
    <button class="audio-btn" style="background:var(--orange)">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 1.5l7 3.5-7 3.5V1.5z" fill="#000"/></svg>
    </button>
    <div class="audio-info">
      <div class="audio-name">${name}</div>
      <div class="audio-time" id="${uid}">0:00</div>
    </div>
    <div class="audio-bar-wrap">
      <div class="audio-track"><div class="audio-prog" style="background:var(--orange)"></div></div>
    </div>`;
  const btn = wrap.querySelector('.audio-btn');
  const timeEl = wrap.querySelector('.audio-time');
  const progEl = wrap.querySelector('.audio-prog');
  let playing = false;
  const pauseIcon = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="2" y="1" width="2.5" height="8" rx="1" fill="#000"/><rect x="5.5" y="1" width="2.5" height="8" rx="1" fill="#000"/></svg>';
  const playIcon = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 1.5l7 3.5-7 3.5V1.5z" fill="#000"/></svg>';
  btn.onclick = () => {
    if(playing) { audio.pause(); btn.innerHTML = playIcon; }
    else { audio.play(); btn.innerHTML = pauseIcon; }
    playing = !playing;
  };
  audio.ontimeupdate = () => {
    if(audio.duration) {
      progEl.style.width = ((audio.currentTime/audio.duration)*100)+'%';
      const m = Math.floor(audio.currentTime/60);
      const s = Math.floor(audio.currentTime%60).toString().padStart(2,'0');
      timeEl.textContent = `${m}:${s}`;
    }
  };
  audio.onended = () => { playing = false; btn.innerHTML = playIcon; progEl.style.width='0%'; };
  row.appendChild(wrap);
}

async function handleMedia(input, type, card) {
  const files = Array.from(input.files);
  const row = card.querySelector('.media-row');
  for(const file of files) {
    if(type === 'video') {
      const url = URL.createObjectURL(file);
      const wrap = document.createElement('div');
      wrap.className = 'vid-item';
      wrap.style.cssText = 'flex:1;min-width:180px';
      const vid = document.createElement('video');
      vid.src = url; vid.controls = true;
      vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:7px';
      wrap.appendChild(vid);
      row.appendChild(wrap);
    } else if(type === 'image') {
      const b64 = await fileToBase64(file);
      const wrap = document.createElement('div');
      wrap.className = 'img-item';
      const img = document.createElement('img');
      img.src = b64;
      wrap.appendChild(img);
      wrap.onclick = () => openLightbox('img', b64);
      row.appendChild(wrap);
      persistMedia(card, 'image', file.name, b64);
    } else if(type === 'audio') {
      const b64 = await fileToBase64(file);
      const name = file.name.replace(/\.[^/.]+$/,'');
      renderAudioItem(row, name, b64);
      persistMedia(card, 'audio', name, b64);
    }
  }
}

// ── TOAST ──
function showSaveToast() {
  let t = document.getElementById('save-toast');
  if(!t) {
    t = document.createElement('div');
    t.id = 'save-toast';
    t.style.cssText = 'position:fixed;bottom:2rem;right:2rem;background:var(--surface);border:1px solid var(--border2);color:var(--green);box-shadow:0 2px 12px rgba(0,0,0,0.12);font-size:12px;padding:8px 16px;border-radius:99px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;font-family:var(--font-sans)';
    t.textContent = '已自动保存';
    document.body.appendChild(t);
  }
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.opacity = '0', 2000);
}

// ── LIGHTBOX ──
function openLightbox(type, url) {
  const lb = document.getElementById('lightbox');
  const content = document.getElementById('lightbox-content');
  content.innerHTML = type === 'img'
    ? `<img src="${url}" style="max-width:90vw;max-height:90vh;border-radius:8px">`
    : `<video src="${url}" controls style="max-width:90vw;max-height:90vh;border-radius:8px">`;
  lb.classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-content').innerHTML = '';
}
</script>
