<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="篮球手记">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef1f7">
<title>你靖哥 的运动空间</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@300;400;500;700;900&family=Oswald:wght@700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #f5f6fa;
  --surface: #ffffff;
  --surface2: #f0f2f8;
  --border: #e2e6f0;
  --border2: #c8cede;
  --green: #00a845;
  --green-dim: #e6f7ee;
  --green-text: #007a32;
  --purple: #6c3de8;
  --purple-dim: #ede8fc;
  --purple-text: #4a22b8;
  --orange: #e8640a;
  --orange-dim: #fef0e6;
  --orange-text: #b84800;
  --blue: #0ea5e9;
  --blue-dim: #e0f4fd;
  --blue-text: #0369a1;
  --text: #111827;
  --text2: #374151;
  --text3: #6b7280;
  --white: #111827;
  --radius: 12px;
  --radius-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── NOISE OVERLAY ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: none;
  pointer-events: none;
  z-index: 0;
}

/* ── HERO ── */
.hero {
  position: relative;
  padding: 2rem 1.25rem 1.75rem;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  background: var(--surface);
}
.hero::after {
  content: 'BBALL';
  position: absolute;
  right: -1rem;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14rem;
  color: rgba(0,145,63,0.06);
  pointer-events: none;
  line-height: 1;
  white-space: nowrap;
}
.hero-eyebrow {
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--green);
  font-weight: 500;
  margin-bottom: 0.75rem;
  text-transform: uppercase;
}
.hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.4rem, 10vw, 5rem);
  letter-spacing: 0.04em;
  color: var(--text);
  line-height: 0.95;
}
.hero-title span { color: var(--green); }
.hero-desc {
  margin-top: 0.875rem;
  font-size: 14px;
  color: var(--text2);
  max-width: 420px;
}
.role-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 1rem;
}
.rpill {
  font-size: 12px;
  font-weight: 500;
  padding: 5px 16px;
  border-radius: 99px;
  letter-spacing: 0.04em;
}
.rp-g { background: var(--green-dim); color: var(--green); border: 1px solid rgba(62,240,124,0.2); }
.rp-p { background: var(--purple-dim); color: var(--purple); border: 1px solid rgba(157,127,252,0.2); }
.rp-o { background: var(--orange-dim); color: var(--orange); border: 1px solid rgba(255,123,66,0.2); }

/* ── STATS ── */
.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}
.stat {
  background: var(--surface);
  padding: 1.125rem 1rem;
  text-align: center;
  transition: background 0.2s;
}
.stat:hover { background: var(--surface2); }
.stat-n {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2rem;
  color: var(--text);
  letter-spacing: 0.02em;
  line-height: 1;
}
.stat-l { font-size: 11px; color: var(--text3); margin-top: 5px; letter-spacing: 0.05em; }

/* ── NAV ── */
.view-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0.75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(238,241,247,0.97); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  z-index: 50;
}
.vnav-btn {
  font-size: 13px;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: 99px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.18s;
  font-family: 'Noto Sans SC', sans-serif;
  letter-spacing: 0.02em;
}
.vnav-btn:hover { color: var(--text); border-color: var(--border2); }
.vnav-btn.active { background: var(--surface2); color: var(--white); border-color: var(--border2); }
.vnav-sep { flex: 1; }
.add-btn {
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 99px;
  background: var(--green);
  color: #000;
  border: none;
  cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif;
  transition: opacity 0.18s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.add-btn:hover { opacity: 0.85; }

/* ── MAIN LAYOUT ── */
.main { padding: 1.25rem 1.25rem 6rem; }

/* ── SECTION HEADER ── */
.sec-hd {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.25rem;
  margin-top: 2.5rem;
}
.sec-hd:first-child { margin-top: 0; }
.sec-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sec-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.06em; color: var(--text); }
.sec-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  color: var(--text3);
  letter-spacing: 0.06em;
}
.sec-divider { height: 1px; background: var(--border); margin: 2.5rem 0; }

/* ── CARD ── */
.entries { display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--border2); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.card-body { padding: 1rem 1.125rem; }
.card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
.card-date { font-size: 13px; color: var(--text3); letter-spacing: 0.04em; }
.card-tag {
  font-size: 13px;
  font-weight: 500;
  padding: 2px 9px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}
.card-title { font-size: 17px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.card-text { font-size: 15px; color: var(--text2); line-height: 1.8; }
.card-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip {
  font-size: 13px;
  padding: 2px 9px;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--text3);
  border: 1px solid var(--border);
}

/* ── MEDIA BLOCK ── */
.media-zone {
  border-top: 1px solid var(--border);
  padding: 0.875rem 1.125rem;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.media-label { font-size: 12px; color: var(--text3); letter-spacing: 0.08em; margin-bottom: 4px; }
.media-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Video */
.vid-item {
  flex: 1;
  min-width: 180px;
  aspect-ratio: 16/9;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}
.vid-item:hover { border-color: var(--border2); }
.vid-item video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vid-placeholder { text-align: center; z-index: 1; pointer-events: none; }
.vid-play-btn {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 7px;
}
.vid-duration { font-size: 11px; color: var(--text2); }
.vid-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s; z-index: 2;
}
.vid-item:hover .vid-overlay { opacity: 1; }

/* Image */
.img-item {
  width: 80px; height: 80px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: border-color 0.2s;
}
.img-item:hover { border-color: var(--border2); }
.img-item img { width: 100%; height: 100%; object-fit: cover; }
.img-grid { display: flex; gap: 6px; flex-wrap: wrap; }

/* Audio */
.audio-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.audio-btn {
  width: 30px; height: 30px; border-radius: 50%;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: opacity 0.2s;
}
.audio-btn:hover { opacity: 0.8; }
.audio-info { flex: 1; min-width: 0; }
.audio-name { font-size: 14px; color: var(--text); font-weight: 500; }
.audio-time { font-size: 12px; color: var(--text3); margin-top: 2px; }
.audio-bar-wrap { flex: 1; min-width: 60px; }
.audio-track {
  height: 3px;
  background: var(--border2);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
}
.audio-prog { height: 3px; border-radius: 2px; width: 0%; transition: width 0.1s; }

/* Upload zones */
.upload-zone {
  border: 1px dashed var(--border2);
  border-radius: var(--radius-sm);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 11px;
  color: var(--text3);
  background: var(--surface2);
}
.upload-zone:hover { border-color: var(--text3); color: var(--text2); }
.upload-zone.drag-over { border-color: var(--green); color: var(--green); background: var(--green-dim); }
.upload-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.upl-btn {
  font-size: 12px;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  border: 1px dashed var(--border2);
  background: var(--surface2);
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s;
  font-family: 'Noto Sans SC', sans-serif;
}
.upl-btn:hover { border-color: var(--text3); color: var(--text2); }

/* ── TIMELINE VIEW ── */
.timeline { display: none; }
.timeline.active { display: block; }
.grid-view { display: block; }
.grid-view.hidden { display: none; }

.tl-year { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--text); letter-spacing: 0.06em; margin-bottom: 1.5rem; margin-top: 0.5rem; }
.tl-month-group { margin-bottom: 2rem; }
.tl-month-label {
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 1rem;
  padding-left: 1.5rem;
  position: relative;
}
.tl-month-label::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 10px;
  height: 1px;
  background: var(--border2);
}
.tl-items { display: flex; flex-direction: column; gap: 0; }
.tl-item {
  display: flex;
  gap: 0;
  padding-left: 1.5rem;
  position: relative;
}
.tl-item::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
}
.tl-item:last-child::before { bottom: 50%; }
.tl-dot {
  position: absolute;
  left: 0;
  top: 1.2rem;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  background: var(--bg);
  z-index: 1;
  flex-shrink: 0;
}
.tl-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.875rem 1rem;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.tl-card:hover { border-color: var(--border2); }
.tl-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.tl-card-date { font-size: 11px; color: var(--text3); }
.tl-card-role { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 3px; }
.tl-card-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.tl-card-text { font-size: 13px; color: var(--text2); line-height: 1.7; }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  border-radius: var(--radius);
  padding: 1.75rem;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--text); letter-spacing: 0.04em; margin-bottom: 1.25rem; }
.form-group { margin-bottom: 1rem; }
.form-label { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--text);
  font-size: 16px;
  -webkit-appearance: none;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--green); }
.form-textarea { min-height: 110px; resize: none; line-height: 1.7; }
.form-select option { background: var(--surface2); }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
.btn-cancel {
  font-size: 13px; padding: 8px 18px; border-radius: 99px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2);
  transition: all 0.18s; cursor: pointer; font-family: 'Noto Sans SC', sans-serif;
  transition: all 0.18s;
}
.btn-cancel:hover { color: var(--text); }
.btn-submit {
  font-size: 13px; padding: 8px 20px; border-radius: 99px;
  border: none; background: var(--green); color: #000;
  cursor: pointer; font-family: 'Noto Sans SC', sans-serif; font-weight: 500;
  transition: opacity 0.18s;
}
.btn-submit:hover { opacity: 0.85; }

/* ── LIGHTBOX ── */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.lightbox.open { display: flex; }
.lightbox img, .lightbox video {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: var(--radius-sm);
}
.lightbox-close {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid #444;
  background: #222;
  color: #ccc;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

/* ── FOOTER ── */
.footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border); }
.footer p { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.role-enter-btn {
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer;
  transition: opacity 0.18s, transform 0.15s;
  border: none;
}
.role-enter-btn:hover { opacity: 0.85; transform: translateY(-1px); }

.role-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 1.375rem 1.25rem;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.role-card-accent { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.role-card-name { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.06em; margin-top: 0.5rem; }
.role-card-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
.role-card-count { font-size: 12px; color: var(--text3); margin-top: 0.875rem; }

.back-btn { color: var(--text2) !important; }
.back-btn:hover { color: var(--text) !important; }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: 1.75rem;
  right: 1.25rem;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0,145,63,0.35);
  z-index: 40;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s, box-shadow 0.15s;
}
.fab:active { transform: scale(0.93); box-shadow: 0 2px 8px rgba(0,145,63,0.25); }

/* ── TOUCH TARGETS ── */
.vnav-btn { min-height: 36px; min-width: 44px; }
.upl-btn { min-height: 40px; padding: 8px 12px; }
.chip { padding: 4px 10px; }
.rpill { padding: 7px 18px; }

/* ── MODAL mobile ── */
@media (max-width: 600px) {
  .modal-overlay { align-items: flex-end; padding: 0; }
  .modal {
    border-radius: 16px 16px 0 0;
    max-height: 92vh;
    padding: 1.5rem 1.25rem 2rem;
    border-bottom: none;
  }
  .modal-title { font-size: 1.3rem; }
}

/* ── AUDIO item mobile ── */
.audio-name { font-size: 14px; font-weight: 500; }
.audio-time { font-size: 12px; color: var(--text3); margin-top: 2px; }

/* ── HORIZONTAL ROLE CARDS ── */
.role-card {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0;
  overflow: hidden;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s;
}
.role-card:active { transform: scale(0.98); }
.rcard-left {
  width: 72px;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  align-self: stretch;
}
.rcard-icon {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  letter-spacing: 0.06em;
  writing-mode: horizontal-tb;
  font-size: 1.1rem;
}
.rcard-right {
  flex: 1;
  padding: 0.875rem 0.875rem 0.875rem 1rem;
  min-width: 0;
}
.rcard-title { font-size: 16px; font-weight: 500; margin-bottom: 3px; }
.rcard-desc { font-size: 12px; color: var(--text3); line-height: 1.5; }
.rcard-count { font-size: 12px; color: var(--text3); margin-top: 8px; }
.rcard-arrow {
  font-size: 22px;
  color: var(--border2);
  padding-right: 1rem;
  flex-shrink: 0;
  font-weight: 300;
}

/* ── CARD ACTIONS ── */
.card-meta { position: relative; }
.card-actions {
  margin-left: auto;
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.15s;
}
.card:hover .card-actions, .card:focus-within .card-actions { opacity: 1; }
@media (max-width: 768px) { .card-actions { opacity: 1; } }
.card-action-btn {
  width: 30px; height: 30px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s;
}
.card-action-btn:hover, .card-action-btn:active { background: var(--surface2); color: var(--text); }
.card-delete-btn:hover, .card-delete-btn:active { background: #fdeade; color: var(--orange); }

/* ── HERO REDESIGN ── */
.hero {
  position: relative;
  padding: 3.5rem 1.25rem 1.75rem;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  background: #111;
  min-height: 180px;
}
.hero-bg-text { display: none; }
.hero-photo {
  position: absolute; inset: 0;
  background-size: cover; background-position: center 20%;
  filter: brightness(0.7) saturate(0.9);
}
.hero-photo-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to bottom, rgba(0,0,0,0.0) 0%, rgba(0,0,0,0.0) 30%, rgba(0,0,0,0.55) 75%, rgba(0,0,0,0.7) 100%);
}
.hero-inner {
  display: flex; align-items: center; gap: 1rem;
  margin-bottom: 1rem; position: relative; z-index: 1;
}
.hero-avatar {
  width: 64px; height: 64px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden;
  border: 2.5px solid rgba(255,255,255,0.5);
  box-shadow: 0 0 20px rgba(0,200,80,0.6), 0 2px 14px rgba(0,0,0,0.45);
}
.hero-avatar svg { width: 100%; height: 100%; }
.hero-name {
  font-family: 'ZCOOL KuaiLe', 'Noto Sans SC', sans-serif;
  font-size: 2rem;
  font-weight: 400;
  color: #fff;
  line-height: 1.1;
  letter-spacing: 0.08em;
  background: linear-gradient(130deg, #ffffff 0%, #c8fde0 50%, #3dff9a 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.6)) drop-shadow(0 0 12px rgba(0,220,100,0.3));
}
.hero-tagline { font-size: 12px; color: rgba(255,255,255,0.7); margin-top: 3px; }
.hero-badges { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.hbadge {
  font-size: 11px; font-weight: 600; padding: 3px 10px;
  border-radius: 99px; letter-spacing: 0.03em;
  backdrop-filter: blur(4px);
}


/* ── MODULE GRID ── */
.module-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.5rem; }
.module-card {
  border-radius: var(--radius); cursor: pointer; position: relative;
  overflow: hidden; -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s; min-height: 155px;
  display: flex; flex-direction: column; justify-content: flex-end; border: none;
}
.module-card:active { transform: scale(0.97); }
.mc-photo {
  position: absolute; inset: 0; background-size: cover; background-position: center;
  filter: brightness(0.65) saturate(0.9); transition: transform 0.3s;
}
.module-card:active .mc-photo { transform: scale(1.04); }
.mc-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.0) 55%);
}
.mc-content { position: relative; z-index: 1; padding: 0.875rem; }
.mc-accent { display: none; }
.mc-icon { display: none; }
.mc-name {
  font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem;
  letter-spacing: 0.06em; line-height: 1; color: #fff;
  text-shadow: 0 2px 8px rgba(0,0,0,0.7), 0 1px 2px rgba(0,0,0,0.9);
}
.mc-sub { font-size: 11px; color: rgba(255,255,255,0.72); margin-top: 2px; }
.mc-count { font-size: 11px; color: rgba(255,255,255,0.55); margin-top: 5px; }
.mc-arrow { display: none; }
.mc-tag {
  display: inline-block; font-size: 10px; font-weight: 700;
  padding: 2px 8px; border-radius: 4px; margin-bottom: 5px; letter-spacing: 0.05em;
}

/* ── FIX dark theme for existing components ── */
.card { background: var(--surface); }
.card:hover { box-shadow: 0 2px 8px rgba(0,0,0,0.07); border-color: var(--border2); }
.tl-card { background: var(--surface); }
.modal { background: var(--surface); }
.form-input, .form-select, .form-textarea { background: var(--surface2); color: var(--text); }
.form-select option { background: var(--surface2); color: var(--text); }
.rp-g { background: var(--green-dim); color: var(--green-text); border-color: rgba(0,168,69,0.2); }
.rp-p { background: var(--purple-dim); color: var(--purple-text); border-color: rgba(108,61,232,0.2); }
.rp-o { background: var(--orange-dim); color: var(--orange-text); border-color: rgba(232,100,10,0.2); }
.chip { background: var(--surface2); color: var(--text3); border-color: var(--border); }
.upl-btn { background: var(--surface2); border-color: var(--border2); color: var(--text3); }
.upl-btn:hover { color: var(--text2); }
.audio-item { background: var(--surface2); }
.vid-item { background: var(--surface2); }
.img-item { background: var(--surface2); }
.view-nav { background: rgba(245,246,250,0.96); border-bottom: 1px solid var(--border); }
.stat { background: var(--surface); }
.stat:hover { background: var(--surface2); }
.card-action-btn:hover, .card-action-btn:active { background: var(--surface2); color: var(--text); }
.card-delete-btn:hover, .card-delete-btn:active { background: var(--orange-dim); color: var(--orange); }
.btn-cancel { color: var(--text2); border-color: var(--border2); }
.modal-overlay { background: rgba(0,0,0,0.55); }
</style>
</head>

  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <div id="lightbox-content"></div>
</div>

<script>
const roleColors = {
  player: { accent: 'var(--green)', dim: 'var(--green-dim)', text: 'var(--green)', label: '球员' },
  coach:  { accent: 'var(--purple)', dim: 'var(--purple-dim)', text: 'var(--purple)', label: '教练' },
  ref:    { accent: 'var(--orange)', dim: 'var(--orange-dim)', text: 'var(--orange)', label: '裁判' }
};

// ── STORAGE ──
const STORE_KEY = 'bball_entries_v1';
const MEDIA_KEY = 'bball_media_v1';

function loadEntries() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e) { return []; }
}
function saveEntries() {
  // save from source containers ONLY, never from display area
  const mediaIdx = loadMediaIndex();
  const entries = [];
  ['player','coach','ref'].forEach(role => {
    document.getElementById('entries-'+role).querySelectorAll('.card[data-role]').forEach(card => {
      const id = card.dataset.id || '';
      entries.push({
        id,
        role:  card.dataset.role,
        date:  card.dataset.date || '',
        title: card.querySelector('.card-title')?.textContent || '',
        text:  card.querySelector('.card-text')?.textContent || '',
        tag:   card.querySelector('.card-tag')?.textContent || '',
        chips: Array.from(card.querySelectorAll('.chip')).map(c => c.textContent),
        media: (id && mediaIdx[id]) ? mediaIdx[id] : [],
      });
    });
  });
  try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); } catch(e) {}
}
function loadMediaIndex() {
  try { return JSON.parse(localStorage.getItem(MEDIA_KEY) || '{}'); } catch(e) { return {}; }
}
function saveMediaIndex(idx) {
  try { localStorage.setItem(MEDIA_KEY, JSON.stringify(idx)); } catch(e) {}
}

// ── RENDER SAVED ENTRIES ──
function renderSavedEntries() {
  const entries = loadEntries();
  // 把 entry.media 同步回 bball_media_v1，统一来源
  const mediaIdx = loadMediaIndex();
  let mediaChanged = false;
  entries.forEach(e => {
    if(e.id && e.media && e.media.length > 0 && !mediaIdx[e.id]) {
      mediaIdx[e.id] = e.media;
      mediaChanged = true;
    }
  });
  if(mediaChanged) saveMediaIndex(mediaIdx);

  entries.forEach(e => {
    const rc = roleColors[e.role];
    if(!rc) return;
    const fmtDate = (e.date||'').replace(/-/g,' · ');
    const chipHtml = (e.chips||[]).map(c=>`<span class="chip">${c}</span>`).join('');
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.role = e.role;
    card.dataset.date = e.date || '';
    if(!e.id) {
      e.id = Date.now() + '_' + Math.random().toString(36).slice(2);
    }
    card.dataset.id = e.id;
    card.innerHTML = buildCardInner(e.role, fmtDate, e.tag, e.title, e.text, chipHtml);
    attachMediaUploadHandlers(card);
    const container = document.getElementById(`entries-${e.role}`);
    if(container) container.appendChild(card);
    restoreMediaForCard(card);
  });
}

function buildCardInner(role, fmtDate, tag, title, text, chipHtml) {
  const rc = roleColors[role];
  return `
    <div class="card-body">
      <div class="card-meta">
        <span class="card-date">${fmtDate}</span>
        ${tag ? `<span class="card-tag" style="background:${rc.dim};color:${rc.accent}">${tag}</span>` : ''}
        <div class="card-actions">
          <button class="card-action-btn" onclick="editCard(this.closest('.card'))" title="编辑">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          </button>
          <button class="card-action-btn card-delete-btn" onclick="deleteCard(this.closest('.card'))" title="删除">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3 4l.8 7.5h6.4L11 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="card-title">${title}</div>
      <div class="card-text">${text}</div>
      ${chipHtml ? `<div class="card-chips">${chipHtml}</div>` : ''}
    </div>
    <div class="media-zone">
      <div class="media-label">媒体</div>
      <div class="upload-btns">
        <label class="upl-btn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1"/><path d="M4 5l2-2 2 2M6 3v4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          拍视频 / 选文件
          <input type="file" accept="video/*" capture="environment" style="display:none">
        </label>
        <label class="upl-btn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1"/><circle cx="4" cy="5" r="1" fill="currentColor"/><path d="M1 9l3-3 2 2 2-2 3 3" stroke="currentColor" stroke-width="1" fill="none"/></svg>
          拍照 / 选图片
          <input type="file" accept="image/*" capture="environment" style="display:none">
        </label>
        <label class="upl-btn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="5" r="2.5" stroke="currentColor" stroke-width="1"/><path d="M3 10c0-1.7 1.3-3 3-3s3 1.3 3 3" stroke="currentColor" stroke-width="1"/><path d="M6 7.5v2" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          录音 / 选音频
          <input type="file" accept="audio/*" style="display:none">
        </label>
      </div>
      <div class="media-row" style="margin-top:4px"></div>
    </div>`;
}

function attachMediaUploadHandlers(card) {
  card.querySelectorAll('input[type=file]').forEach(input => {
    const type = input.accept.includes('video') ? 'video' : input.accept.includes('image') ? 'image' : 'audio';
    input.onchange = function() { handleMedia(this, type, this.closest('.card')); };
  });
}

// ── MEDIA PERSISTENCE (base64 for images/audio, skip video) ──
function getCardId(card) {
  if(!card.dataset.id) card.dataset.id = Date.now() + '_' + Math.random().toString(36).slice(2);
  return card.dataset.id;
}
function restoreMediaForCard(card) {
  const idx = loadMediaIndex();
  const id = card.dataset.id;
  if(!id || !idx[id]) return;
  const row = card.querySelector('.media-row');
  idx[id].forEach(m => {
    if(m.type === 'image') {
      const wrap = document.createElement('div');
      wrap.className = 'img-item';
      const img = document.createElement('img');
      img.src = m.data;
      wrap.appendChild(img);
      wrap.onclick = () => openLightbox('img', m.data);
      row.appendChild(wrap);
    } else if(m.type === 'audio') {
      renderAudioItem(row, m.name, m.data);
    }
  });
}
function persistMedia(card, type, name, data) {
  const id = getCardId(card);
  const idx = loadMediaIndex();
  if(!idx[id]) idx[id] = [];
  if(type !== 'video') {
    idx[id].push({ type, name, data });
    saveMediaIndex(idx);
    // 立刻同步到 entries，确保媒体和记录一起持久化
    saveEntries();
  }
}

// ── STATS ──
function updateStats() {
  const p = document.getElementById('entries-player').querySelectorAll('.card[data-role]').length;
  const c = document.getElementById('entries-coach').querySelectorAll('.card[data-role]').length;
  const r = document.getElementById('entries-ref').querySelectorAll('.card[data-role]').length;
  // stats shown on module cards only (home-cnt-*)
  // fitness count
  try {
    const fd = JSON.parse(localStorage.getItem('bball_fitness_v1') || '{"sessions":[]}');
    const fn = fd.sessions ? fd.sessions.length : 0;
    const fe = document.getElementById('cnt-fit');
    if(fe) fe.textContent = fn;
    const hfe = document.getElementById('home-cnt-fit');
    if(hfe) hfe.textContent = fn + ' 次训练';
  } catch(e) {}
}

// ── INIT ──
renderSavedEntries();
saveEntries(); // always re-save to persist any newly generated ids
updateStats();
updateHomeCount();

// ── ROLE NAVIGATION ──
let currentRole = null;

function enterRole(role) {
  currentRole = role;
  const rc = roleColors[role];

function buildRoleTimeline(role) {
  const src = document.getElementById('entries-' + role);
  const cards = Array.from(src.querySelectorAll('.card[data-role]'));
  const tlDisplay = document.getElementById('role-timeline-display');
  if(!cards.length) { tlDisplay.innerHTML = '<p style="color:var(--text3);font-size:13px;padding:2rem 0">还没有记录</p>'; return; }
  const byMonth = {};
  cards.forEach(card => {
    const d = card.dataset.date || '2024-01-01';
    const [y,m] = d.split('-');
    const key = `${y}-${m}`;
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(card);
  });
  const months = Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
  const monthNames = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const rc = roleColors[role];
  let html = '';
  let lastYear = '';
  months.forEach(key => {
    const [y,m] = key.split('-');
    if(y !== lastYear) { html += `<div class="tl-year">${y}</div>`; lastYear = y; }
    html += `<div class="tl-month-group"><div class="tl-month-label">${monthNames[parseInt(m)]||m}</div><div class="tl-items">`;
    byMonth[key].forEach(card => {
      const title = card.querySelector('.card-title')?.textContent || '';
      const text = card.querySelector('.card-text')?.textContent || '';
      const date = (card.dataset.date||'').replace(/-/g,' · ');
      html += `<div class="tl-item">
        <div class="tl-dot" style="border-color:${rc.accent}"></div>
        <div class="tl-card">
          <div class="tl-card-top"><span class="tl-card-date">${date}</span></div>
          <div class="tl-card-title">${title}</div>
          <div class="tl-card-text">${text.substring(0,100)}${text.length>100?'…':''}</div>
        </div>
      </div>`;
    });
    html += '</div></div>';
  });
  tlDisplay.innerHTML = html;
}

// ── TIMELINE ──
function buildTimeline() {
  const cards = Array.from(document.querySelectorAll('.card[data-role]'));
  if(!cards.length) { document.getElementById('timeline-content').innerHTML = '<p style="color:var(--text3);font-size:13px">暂无记录</p>'; return; }
  const byMonth = {};
  cards.forEach(card => {
    const d = card.dataset.date || '2024-01-01';
    const [y,m] = d.split('-');
    const key = `${y}-${m}`;
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(card);
  });
  const months = Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
  const monthNames = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  let html = '';
  let lastYear = '';
  months.forEach(key => {
    const [y,m] = key.split('-');
    if(y !== lastYear) { html += `<div class="tl-year">${y}</div>`; lastYear = y; }
    const monthLabel = monthNames[parseInt(m)] || m;
    html += `<div class="tl-month-group"><div class="tl-month-label">${monthLabel}</div><div class="tl-items">`;
    byMonth[key].forEach(card => {
      const role = card.dataset.role;
      const rc = roleColors[role];
      const title = card.querySelector('.card-title')?.textContent || '';
      const text = card.querySelector('.card-text')?.textContent || '';
      const date = (card.dataset.date||'').replace(/-/g,' · ');
      html += `<div class="tl-item">
        <div class="tl-dot" style="border-color:${rc.accent}"></div>
        <div class="tl-card">
          <div class="tl-card-top">
            <span class="tl-card-date">${date}</span>
            <span class="tl-card-role" style="background:${rc.dim};color:${rc.accent}">${rc.label}</span>
          </div>
          <div class="tl-card-title">${title}</div>
          <div class="tl-card-text">${text.substring(0,80)}${text.length>80?'…':''}</div>
        </div>
      </div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('timeline-content').innerHTML = html;
}

// ── IN-MEMORY ENTRY STORE (single source of truth) ──
let entryStore = {}; // id -> {id, role, date, tag, title, text, chips:[]}

function syncStoreFromDOM() {
  entryStore = {};
  ['player','coach','ref'].forEach(r => {
    document.getElementById('entries-'+r).querySelectorAll('.card[data-role]').forEach(card => {
      const id = card.dataset.id;
      if(!id) return;
      entryStore[id] = {
        id,
        role: card.dataset.role,
        date: card.dataset.date || '',
        tag:   card.querySelector('.card-tag')?.textContent || '',
        title: card.querySelector('.card-title')?.textContent || '',
        text:  card.querySelector('.card-text')?.textContent || '',
        chips: Array.from(card.querySelectorAll('.chip')).map(c=>c.textContent),
      };
    });
  });
}

function editCard(card) {
  // always read from store, not from DOM clone
  syncStoreFromDOM();
  const id = card.dataset.id;
  const entry = entryStore[id];
  if(!entry) return;

  document.getElementById('f-date').value = entry.date;
  document.getElementById('f-role').value = entry.role;
  document.getElementById('f-tag').value = entry.tag;
  document.getElementById('f-title').value = entry.title;
  document.getElementById('f-text').value = entry.text;
  document.getElementById('f-chips').value = entry.chips.join(', ');

  document.getElementById('modal-overlay').dataset.editId = id;
  document.getElementById('modal-title').textContent = '编辑记录';
  document.getElementById('modal-overlay').classList.add('open');
}

function deleteCard(card) {
  if(!confirm('确认删除这条记录？')) return;
  const id = card.dataset.id;
  const role = card.dataset.role;

  // remove from source container only (display will refresh)
  ['player','coach','ref'].forEach(r => {
    document.getElementById('entries-'+r).querySelectorAll(`[data-id="${id}"]`).forEach(c => c.remove());
  });

  // remove media
  const idx = loadMediaIndex();
  delete idx[id];
  saveMediaIndex(idx);

  saveEntries();
  updateStats();
  updateHomeCount();
  if(currentRole) renderRoleEntries(currentRole);
  showSaveToast();
}

function submitEntry() {
  const date  = document.getElementById('f-date').value;
  const role  = document.getElementById('f-role').value;
  const tag   = document.getElementById('f-tag').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const text  = document.getElementById('f-text').value.trim();
  const chips = document.getElementById('f-chips').value.trim();
  if(!title||!text) { alert('请填写标题和内容'); return; }

  const fmtDate  = date.replace(/-/g,' · ');
  const chipHtml = chips ? chips.split(',').map(c=>`<span class="chip">${c.trim()}</span>`).join('') : '';
  const editId   = document.getElementById('modal-overlay').dataset.editId;

  if(editId) {
    // ── EDIT: remove old card from ALL source containers, insert updated one ──
    ['player','coach','ref'].forEach(r => {
      document.getElementById('entries-'+r).querySelectorAll(`[data-id="${editId}"]`).forEach(c => c.remove());
    });
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.role = role;
    card.dataset.date = date;
    card.dataset.id   = editId;
    card.innerHTML = buildCardInner(role, fmtDate, tag, title, text, chipHtml);
    attachMediaUploadHandlers(card);
    restoreMediaForCard(card);
    document.getElementById('entries-' + role).prepend(card);
  } else {
    // ── NEW ENTRY ──
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.role = role;
    card.dataset.date = date;
    card.dataset.id   = Date.now() + '_' + Math.random().toString(36).slice(2);
    card.innerHTML = buildCardInner(role, fmtDate, tag, title, text, chipHtml);
    attachMediaUploadHandlers(card);
    document.getElementById('entries-' + role).prepend(card);
  }

  saveEntries();
  closeModal();
  updateStats();
  updateHomeCount();
  if(currentRole) renderRoleEntries(currentRole);
  showSaveToast();
}

// ── MEDIA UPLOAD ──
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function renderAudioItem(row, name, src) {
  const wrap = document.createElement('div');
  wrap.className = 'audio-item';
  wrap.style.width = '100%';
  const audio = new Audio(src);
  const uid = 'at-' + Date.now() + Math.random().toString(36).slice(2);
  wrap.innerHTML = `
    <button class="audio-btn" style="background:var(--orange)">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 1.5l7 3.5-7 3.5V1.5z" fill="#000"/></svg>
    </button>
    <div class="audio-info">
      <div class="audio-name">${name}</div>
      <div class="audio-time" id="${uid}">0:00</div>
    </div>
    <div class="audio-bar-wrap">
      <div class="audio-track"><div class="audio-prog" style="background:var(--orange)"></div></div>
    </div>`;
  const btn = wrap.querySelector('.audio-btn');
  const timeEl = wrap.querySelector('.audio-time');
  const progEl = wrap.querySelector('.audio-prog');
  let playing = false;
  const pauseIcon = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="2" y="1" width="2.5" height="8" rx="1" fill="#000"/><rect x="5.5" y="1" width="2.5" height="8" rx="1" fill="#000"/></svg>';
  const playIcon = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 1.5l7 3.5-7 3.5V1.5z" fill="#000"/></svg>';
  btn.onclick = () => {
    if(playing) { audio.pause(); btn.innerHTML = playIcon; }
    else { audio.play(); btn.innerHTML = pauseIcon; }
    playing = !playing;
  };
  audio.ontimeupdate = () => {
    if(audio.duration) {
      progEl.style.width = ((audio.currentTime/audio.duration)*100)+'%';
      const m = Math.floor(audio.currentTime/60);
      const s = Math.floor(audio.currentTime%60).toString().padStart(2,'0');
      timeEl.textContent = `${m}:${s}`;
    }
  };
  audio.onended = () => { playing = false; btn.innerHTML = playIcon; progEl.style.width='0%'; };
  row.appendChild(wrap);
}

async function handleMedia(input, type, card) {
  const files = Array.from(input.files);
  const row = card.querySelector('.media-row');
  for(const file of files) {
    if(type === 'video') {
      const url = URL.createObjectURL(file);
      const wrap = document.createElement('div');
      wrap.className = 'vid-item';
      wrap.style.cssText = 'flex:1;min-width:180px';
      const vid = document.createElement('video');
      vid.src = url; vid.controls = true;
      vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:7px';
      wrap.appendChild(vid);
      row.appendChild(wrap);
    } else if(type === 'image') {
      const b64 = await fileToBase64(file);
      const wrap = document.createElement('div');
      wrap.className = 'img-item';
      const img = document.createElement('img');
      img.src = b64;
      wrap.appendChild(img);
      wrap.onclick = () => openLightbox('img', b64);
      row.appendChild(wrap);
      persistMedia(card, 'image', file.name, b64);
    } else if(type === 'audio') {
      const b64 = await fileToBase64(file);
      const name = file.name.replace(/\.[^/.]+$/,'');
      renderAudioItem(row, name, b64);
      persistMedia(card, 'audio', name, b64);
    }
  }
}

function loadRefCardStatus() {
  try { refCardStatus = JSON.parse(localStorage.getItem(REF_CARD_KEY) || '{}'); } catch(e) { refCardStatus = {}; }
}
function saveRefCardStatus() {
  try { localStorage.setItem(REF_CARD_KEY, JSON.stringify(refCardStatus)); } catch(e) {}
}

// ── 执裁日志与大系统同步 ──
// 大系统存储: bball_entries_v1, role=ref
// 执裁日志从大系统 ref 记录中读取，写入也直接写入大系统

function getRefLogsFromStore() {
  // 从DOM中读取 entries-ref 容器中的卡片（大系统已渲染的数据）
  const container = document.getElementById('entries-ref');
  if (!container) return [];
  const cards = Array.from(container.querySelectorAll('.card[data-role="ref"]'));
  return cards.map(c => ({
    id: c.dataset.id,
    date: c.dataset.date || '',
    title: c.querySelector('.card-title')?.textContent || '',
    text: c.querySelector('.card-text')?.textContent || '',
    tag: c.querySelector('.card-tag')?.textContent || '',
    chips: Array.from(c.querySelectorAll('.chip')).map(ch => ch.textContent),
  })).reverse(); // 最新在前
}

function saveRefLogToStore(date, title, text, tag, chips, rating) {
  // 构建一条新记录写入大系统（role=ref）
  const rc = roleColors['ref'];
  const fmtDate = date.replace(/-/g,' · ');
  const chipArr = chips ? chips.split(',').map(s=>s.trim()).filter(Boolean) : [];
  if (rating) chipArr.unshift('评分' + ['','😞','😐','🙂','😊','🔥'][rating] || '');
  const chipHtml = chipArr.map(c=>`<span class="chip">${c}</span>`).join('');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.role = 'ref';
  card.dataset.date = date;
  card.dataset.id = Date.now() + '_' + Math.random().toString(36).slice(2);
  card.innerHTML = buildCardInner('ref', fmtDate, tag, title, text, chipHtml);
  attachMediaUploadHandlers(card);
  document.getElementById('entries-ref').prepend(card);
  saveEntries();
  updateStats();
  updateHomeCount();
  // 刷新执裁精进系统的日志显示
  renderRefLogs();
  showRefToast('✅ 记录已保存到大系统');
}

  loadRefCardStatus();
  const panel = document.getElementById('ref-system-panel');
  panel.innerHTML = buildRefSystemHTML();

  bindRefSystemEvents();

}

<!-- 规则图谱 -->
<div class="rs-section" id="rs-rules">
  <div class="rs-rule-tabs">
    <button class="rs-rtab active" onclick="filterRefRules('all',this)">全部</button>
    <button class="rs-rtab" onclick="filterRefRules('clock',this)">计时</button>
    <button class="rs-rtab" onclick="filterRefRules('violation',this)">违例</button>
    <button class="rs-rtab" onclick="filterRefRules('foul',this)">犯规</button>
    <button class="rs-rtab" onclick="filterRefRules('special',this)">特殊</button>
  </div>

  <!-- 8秒/24秒 -->
  <div class="rs-rule-card" data-rcat="clock">
    <div class="rs-rule-hd" onclick="toggleRefRule(this)">
      <div><div class="rs-rule-meta">计时 · 第28/29条 · OBR2024</div><div class="rs-rule-name">8秒 & 24秒——计时边界</div></div>
      <span class="rs-rule-arrow">›</span>
    </div>
    <div class="rs-rule-body">
      <div class="rs-sec-title">核心判断</div>
      <div class="rs-key">投篮离手瞬间，球队控制球结束——8秒/24秒计时同时终止，无论球是否中篮。</div>
      <div class="rs-sec-title">高频易错</div>
      <div class="rs-warn">❌ 后场投篮出手还没过中线 → 判8秒。✅ 正确：投篮离手时控制球已结束，不存在8秒违例，中篮计3分有效。</div>
      <div class="rs-warn">❌ 进攻计时钟信号响了就直接判违例。✅ 正确：信号响时球若已触及篮圈，不判违例。</div>
      <div class="rs-sec-title">24秒重置完整逻辑（OBR2024第29.2条）</div>
      <div class="rs-pos-block">
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#d0f0e0;color:#006b2e;font-size:9px">球权不变<br>后场</div><div class="rs-pos-desc">重置为24秒</div></div>
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#e8eeff;color:#3d1fa0;font-size:9px">球权不变<br>前场</div><div class="rs-pos-desc">剩余≥14秒：不重置，继续计时<br>剩余≤13秒：重置为14秒</div></div>
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fff3e8;color:#a03a00;font-size:9px">球权转换<br>前场</div><div class="rs-pos-desc">固定重置为14秒</div></div>
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fde8d8;color:#e05040;font-size:9px">技术犯规<br>控球方</div><div class="rs-pos-desc">不重置，从停止时继续</div></div>
      </div>
    </div>
  </div>

  <!-- 比赛开始结束 -->
  <div class="rs-rule-card" data-rcat="clock">
    <div class="rs-rule-hd" onclick="toggleRefRule(this)">
      <div><div class="rs-rule-meta">计时 · 第9条</div><div class="rs-rule-name">比赛开始与结束</div></div>
      <span class="rs-rule-arrow">›</span>
    </div>
    <div class="rs-rule-body">
      <div class="rs-key">第一节：主裁抛球离手时比赛开始。其他各节：掷球入界队员触球时比赛开始。每节结束：计时钟信号响起时比赛结束。</div>
      <div class="rs-warn">跳球前（抛球离手前）发生犯规：比赛尚未开始，属于比赛休息期间犯规，登记但以跳球重新开始比赛。</div>
    </div>
  </div>

  <!-- 走步 -->
  <div class="rs-rule-card" data-rcat="violation">
    <div class="rs-rule-hd" onclick="toggleRefRule(this)">
      <div><div class="rs-rule-meta">违例 · 第25条 · OBR2024完整两步规则</div><div class="rs-rule-name">走步——最高频争议</div></div>
      <span class="rs-rule-arrow">›</span>
    </div>
    <div class="rs-rule-body">
      <div class="rs-key">判断对象永远是脚，不是步数。核心是：第一步在哪里认定，第二步之后脚是否继续移动。</div>
      <div class="rs-sec-title">情形一：静止持球</div>
      <div class="rs-text">双脚同时触地持球：任一脚抬起，另一脚即成中枢脚，不可再移动。<br>起跳传球/投篮：可以跳起，但任一脚落地前球必须已离手。<br>开始运球：中枢脚未离地前球必须已离手。</div>
      <div class="rs-sec-title">情形二：移动中接球（两步规则）</div>
      <div class="rs-key">获得控制球后，最多可走两步来停下、传球或投篮。</div>
      <div class="rs-text"><strong>第一步</strong>：获得控制球后，一脚或双脚同时触地均算第一步。<br>— 双脚同时落地：任一脚可作中枢脚<br>— 单脚落地：该脚为中枢脚<br><strong>第二步</strong>：第一步后另一脚触地，或双脚同时触地。<br>— 单脚起跳后双脚同时落地算第二步，此时不可再转轴，双脚均不可再离地（否则违例）<br><strong>开始运球</strong>：必须在第二步之前出手运球（即第一步时已出手）。</div>
      <div class="rs-warn">⚠️ 高频误判：运球结束收球后走两步再投篮→合法（这是运球结束后的两步）。关键：看收球瞬间脚在哪里，从那一刻开始数。</div>
      <div class="rs-sec-title">情形三：倒地持球</div>
      <div class="rs-text">倒地后滑行持球：合法。躺地获得控制球：合法。随后滚动或试图站起时仍持球：违例。</div>
    </div>
  </div>

  <!-- 非法运球 -->
  <div class="rs-rule-card" data-rcat="violation">
    <div class="rs-rule-hd" onclick="toggleRefRule(this)">
      <div><div class="rs-rule-meta">违例 · 第24条</div><div class="rs-rule-name">非法运球</div></div>
      <span class="rs-rule-arrow">›</span>
    </div>
    <div class="rs-rule-body">
      <div class="rs-key">两次运球：运球结束后再次拍球运球。携带球：手掌明显向上托住球，或球静止于掌中。</div>
      <div class="rs-warn">运球中球从手上滑落再捡起继续运球→合法（球未被控制住）。判断标准是"是否曾经控制球后停止运球"。</div>
    </div>
  </div>

  <!-- 3秒/5秒 -->
  <div class="rs-rule-card" data-rcat="violation">
    <div class="rs-rule-hd" onclick="toggleRefRule(this)">
      <div><div class="rs-rule-meta">违例 · 第26/27条</div><div class="rs-rule-name">3秒 & 5秒规则</div></div>
      <span class="rs-rule-arrow">›</span>
    </div>
    <div class="rs-rule-body">
      <div class="rs-sec-title">3秒违例</div>
      <div class="rs-key">进攻队员不得在对方禁区内停留超过3秒（持球或不持球均适用）。</div>
      <div class="rs-text">例外：正在做投篮动作时不计时。球队失去控制球时不计时（如球在空中）。队员正在离开禁区时不计时。</div>
      <div class="rs-sec-title">5秒违例</div>
      <div class="rs-key">被严密防守（一臂距离内）的持球队员必须在5秒内传球、投球或运球。</div>
      <div class="rs-warn">漏接球后重新拿住：5秒计时不重置，继续计时。漏接不是传/投/运。</div>
    </div>
  </div>

  <!-- 侵人犯规 -->
  <div class="rs-rule-card" data-rcat="foul">
    <div class="rs-rule-hd" onclick="toggleRefRule(this)">
      <div><div class="rs-rule-meta">犯规 · 第33条 · OBR2024精确标准</div><div class="rs-rule-name">侵人犯规——圆柱体 & 垂直性</div></div>
      <span class="rs-rule-arrow">›</span>
    </div>
    <div class="rs-rule-body">
      <div class="rs-sec-title">圆柱体原则</div>
      <div class="rs-key">每名队员在场上占据一个"想象中的圆柱体"空间。任何人离开自己的圆柱体并与已建立圆柱体的对方接触，造成接触的一方负责。</div>
      <div class="rs-sec-title">合法防守位置建立条件</div>
      <div class="rs-key">面向对手 + 双脚触地。建立后可：保持不动、垂直起跳、侧向移动、后退移动。不可：向持球队员方向移动。</div>
      <div class="rs-sec-title">撞人/阻挡判断（OBR2024第33.4条）</div>
      <div class="rs-warn">❌ 原错误理解：判断时只看防守方双脚是否停稳。<br>✅ OBR2024精确标准：防守方建立位置后允许侧向/后退移动，脚可短暂离地。关键是移动方向是否朝向持球队员，以及接触是否发生在躯干。</div>
      <div class="rs-sec-title">无球队员防守（第33.5条）</div>
      <div class="rs-key">时间和距离原则：防守方至少留出对手1个正常步骤的空间来停止或改变方向，距离要求与对手速度成正比。</div>
    </div>
  </div>

  <!-- 违体犯规 -->
  <div class="rs-rule-card" data-rcat="foul">
    <div class="rs-rule-hd" onclick="toggleRefRule(this)">
      <div><div class="rs-rule-meta">犯规 · 第37条 · OBR2024四种情形</div><div class="rs-rule-name">违体犯规——判断标准</div></div>
      <span class="rs-rule-arrow">›</span>
    </div>
    <div class="rs-rule-body">
      <div class="rs-pos-block">
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fde8d8;color:#a03a00;font-size:9px">①</div><div class="rs-pos-desc" style="font-size:12px">与对方接触，但没有正当争夺球权的行为。</div></div>
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fde8d8;color:#a03a00;font-size:9px">②</div><div class="rs-pos-desc" style="font-size:12px">试图打球或防守时造成过激、激烈的接触。</div></div>
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fde8d8;color:#a03a00;font-size:9px">③</div><div class="rs-pos-desc" style="font-size:12px"><strong style="color:#a03a00">转换防守中不必要接触</strong>：防守方为阻止快攻推进（进攻方开始投篮动作前），造成不必要接触。<br><span style="color:var(--text3);font-size:11px">→ 校园比赛最常漏判</span></div></div>
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fde8d8;color:#a03a00;font-size:9px">④</div><div class="rs-pos-desc" style="font-size:12px"><strong style="color:#a03a00">背后/侧面非法接触</strong>：进攻方正向对方篮筐推进、与篮筐之间无防守队员，防守方从背后或侧面造成接触（投篮动作前）。</div></div>
      </div>
      <div class="rs-sec-title">罚则</div>
      <div class="rs-text">非投篮动作：2次不占位罚球。投篮动作且球中：得分有效+1次罚球。投篮动作且球未中：2或3次罚球。<br>所有情况：罚球后前场掷球入界。</div>
      <div class="rs-warn">累计2次违体，或1技术+1违体，或2技术 = 取消比赛资格（离场）。</div>
    </div>
  </div>

  <!-- 干涉/干扰得分 -->
  <div class="rs-rule-card" data-rcat="special">
    <div class="rs-rule-hd" onclick="toggleRefRule(this)">
      <div><div class="rs-rule-meta">特殊 · 第31条 · OBR2024</div><div class="rs-rule-name">干涉得分 & 干扰得分</div></div>
      <span class="rs-rule-arrow">›</span>
    </div>
    <div class="rs-rule-body">
      <div class="rs-key">球只有在到达最高点并开始下落后被触及，才是违例（干涉/干扰得分）。在最高点触及 = 合法。</div>
      <div class="rs-sec-title">防守方违例（干涉得分）</div>
      <div class="rs-text">球在向下飞行轨迹中被防守方触及 = 干涉得分违例，进球得分有效。</div>
      <div class="rs-sec-title">进攻方违例（干扰得分）</div>
      <div class="rs-text">进攻方在球的下落轨迹中触及球（除非球明显不会进篮）= 干扰得分违例，进球无效。</div>
    </div>
  </div>

  <!-- 得分值 -->
  <div class="rs-rule-card" data-rcat="special">
    <div class="rs-rule-hd" onclick="toggleRefRule(this)">
      <div><div class="rs-rule-meta">特殊 · 第16条</div><div class="rs-rule-name">得分值判定</div></div>
      <span class="rs-rule-arrow">›</span>
    </div>
    <div class="rs-rule-body">
      <div class="rs-key">计3分的充分条件：球从三分投篮区投篮动作离手进入球篮。掷球入界出手不算投篮动作，无论从哪个区域触及都只计2分。</div>
    </div>
  </div>

  <!-- 跳球/交替拥有 -->
  <div class="rs-rule-card" data-rcat="special">
    <div class="rs-rule-hd" onclick="toggleRefRule(this)">
      <div><div class="rs-rule-meta">特殊 · 第12条</div><div class="rs-rule-name">跳球 & 交替拥有</div></div>
      <span class="rs-rule-arrow">›</span>
    </div>
    <div class="rs-rule-body">
      <div class="rs-key">24秒信号响时球在空中：触圈→不判违例；未触圈→判进攻时间违例（交替拥有程序不适用于投篮时间违例）。</div>
      <div class="rs-warn">进攻计时钟时间已到时发生争球→不适用交替拥有程序，这是投篮时间违例，由对方掷球入界。</div>
    </div>
  </div>
</div>

<!-- 裁判法 -->
<div class="rs-section" id="rs-tech">
  <div class="rs-rule-card" style="margin-bottom:10px">
    <div class="rs-rule-hd" style="cursor:default">
      <div><div class="rs-rule-meta">基础概念</div><div class="rs-rule-name">三色标记系统</div></div>
    </div>
    <div class="rs-rule-body" style="display:block;padding:12px 15px 14px">
      <div class="rs-text">
        <span style="color:#4080e0">●</span> <strong>前导（L）</strong>：端线一侧，始终在强侧（球侧）<br>
        <span style="color:#40c080">●</span> <strong>追踪（T）</strong>：靠近中线，与前导同侧（强侧）<br>
        <span style="color:#e05040">●</span> <strong>中央（C）</strong>：罚球线延长线，通常在弱侧<br><br>
        核心理念：尽可能让两名裁判（前导+追踪）落位于球侧，提高决策准确性。
      </div>
    </div>
  </div>

  <div class="rs-tech-card">
    <div class="rs-tech-hd" onclick="toggleRefTech(this)">
      <div class="rs-tech-dot" style="background:var(--orange)"></div>
      <div class="rs-tech-info"><div class="rs-tech-name">轮转的四个阶段</div><div class="rs-tech-sub">完整流程 · 最重要的裁判法内容</div></div>
      <span class="rs-tech-arrow">›</span>
    </div>
    <div class="rs-tech-body">
      <div class="rs-key">轮转成功三要素：① 适当的发动点（矩形2区）② 适当的时机（球移至弱侧）③ 适当的技巧（预测、急速走动、毫不犹豫）</div>
      <div class="rs-pos-block">
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fff3e8;color:#a03a00">阶1</div><div><div class="rs-pos-desc">球进入矩形2区</div><div class="rs-pos-note">前导移至发动轮转点待机。这不是执裁位置，发生突破/投篮时要立即移动保持执裁距离。</div></div></div>
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fff3e8;color:#a03a00">阶2</div><div><div class="rs-pos-desc">球移至弱侧（矩形2区之外）</div><div class="rs-pos-note">前导停留1秒（"一次呼吸"）分析弱侧是否立即有投篮/突破。若会→停留不轮转；若不会→发动轮转。同时追踪开始移向新中央位置。</div></div></div>
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fff3e8;color:#a03a00">阶3</div><div><div class="rs-pos-desc">前导完成轮转，到达新球侧</div><div class="rs-pos-note">中央一直执裁球直到前导准备好接管，然后中央向后退（45度面向球篮）移至新追踪位置。</div></div></div>
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fff3e8;color:#a03a00">阶4</div><div><div class="rs-pos-desc">中断轮转的条件</div><div class="rs-pos-note">弱侧突然突破/投篮：前导停止轮转返回。横传球到另一侧：前导停止返回球侧。前导越过篮板或禁区中点后=不可返回的点，必须完成轮转。</div></div></div>
      </div>
    </div>
  </div>

  <div class="rs-tech-card">
    <div class="rs-tech-hd" onclick="toggleRefTech(this)">
      <div class="rs-tech-dot" style="background:#4080e0"></div>
      <div class="rs-tech-info"><div class="rs-tech-name">前导（L）执裁要点</div><div class="rs-tech-sub">端线一侧 · 始终球侧 · 动作区核心</div></div>
      <span class="rs-tech-arrow">›</span>
    </div>
    <div class="rs-tech-body">
      <div class="rs-check-item"><span class="rs-check-icon">▸</span>工作区：三分线到篮板边缘，面对球篮45°角，距端线不超过1米，禁区外。</div>
      <div class="rs-check-item"><span class="rs-check-icon">▸</span>始终在球侧（强侧）落位，负责动作区（"公交车站"）绝大多数犯规判罚。</div>
      <div class="rs-check-item"><span class="rs-check-icon">▸</span>球传至强侧篮下时：向外做"交叉步"，扩宽执裁空间，可看清突破路径和弱侧协防。</div>

function switchRefTab(tab, btn) {
  document.querySelectorAll('.rs-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else {
    const map = {overview:0,rules:1,tech:2,cards:3,log:4};
    const tabs = document.querySelectorAll('.rs-tab');
    if (tabs[map[tab]]) tabs[map[tab]].classList.add('active');
  }
  document.querySelectorAll('.rs-section').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('rs-' + tab);
  if (target) target.classList.add('active');
  if (tab === 'overview') { renderRefRecentLog(); updateRefOverviewCount(); }
  if (tab === 'log') renderRefLogs();
  if (tab === 'cards') { loadRefCard(refCardIndex); renderRefCardList(); updateRefCardStats(); }
}

}

// ── 卡片系统 ──
function getRefFilteredCards() {
  if (refCardFilter === 'all') return REF_CARDS;
  return REF_CARDS.filter(c => c.cat === refCardFilter);
}
function loadRefCard(idx) {
  const cards = getRefFilteredCards();
  if (!cards.length) return;
  const card = cards[idx % cards.length];
  const typeEl = document.getElementById('rs-flash-type');
  const qEl = document.getElementById('rs-flash-q');
  const aEl = document.getElementById('rs-flash-a');
  if (typeEl) typeEl.textContent = card.type;
  if (qEl) qEl.textContent = card.q;
  if (aEl) aEl.textContent = card.a;
  const inner = document.getElementById('rs-flash-inner');
  if (inner) inner.classList.remove('flipped');
  updateRefCardStats();
}
function flipRefCard() {
  const inner = document.getElementById('rs-flash-inner');
  if (inner) inner.classList.toggle('flipped');
}
function nextRefCard() {
  const cards = getRefFilteredCards();
  refCardIndex = (refCardIndex + 1) % cards.length;
  loadRefCard(refCardIndex);
}
function markRefCard(correct) {
  const cards = getRefFilteredCards();
  const card = cards[refCardIndex % cards.length];
  refCardStatus[card.id] = correct ? 'right' : 'wrong';
  saveRefCardStatus();
  showRefToast(correct ? '✅ 已标记为掌握' : '❌ 已标记为需复习');
  updateRefCardStats();
  renderRefCardList();
  setTimeout(() => nextRefCard(), 400);
}
function updateRefCardStats() {
  const done = Object.values(refCardStatus).filter(v => v === 'right').length;
  const wrong = Object.values(refCardStatus).filter(v => v === 'wrong').length;
  const totalEl = document.getElementById('rs-total');
  const doneEl = document.getElementById('rs-done');
  const wrongEl = document.getElementById('rs-wrong');
  const prog = document.getElementById('rs-progress');
  if (totalEl) totalEl.textContent = REF_CARDS.length;
  if (doneEl) doneEl.textContent = done;
  if (wrongEl) wrongEl.textContent = wrong;
  if (prog) prog.style.width = (done / REF_CARDS.length * 100) + '%';
  const ovEl = document.getElementById('rs-card-overview-count');
  if (ovEl) ovEl.textContent = `${done}/${REF_CARDS.length} 已掌握`;
}
function filterRefCards(cat, btn) {
  refCardFilter = cat;
  refCardIndex = 0;
  document.querySelectorAll('.rs-cfbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadRefCard(0);
  renderRefCardList();
}
function renderRefCardList() {
  const cards = getRefFilteredCards();
  const list = document.getElementById('rs-card-list');
  if (!list) return;
  list.innerHTML = cards.map((card, i) => {
    const status = refCardStatus[card.id];
    const icon = status === 'right' ? '✅' : status === 'wrong' ? '❌' : '○';
    return `<div class="rs-card-list-item" onclick="jumpRefCard(${i})">
      <span style="font-size:14px">${icon}</span>
      <div style="flex:1">
        <div style="font-size:10px;color:var(--text3);margin-bottom:2px">${card.type}</div>
        <div style="font-size:12px;color:var(--text);line-height:1.4">${card.q.substring(0,48)}${card.q.length>48?'...':''}</div>
      </div>
    </div>`;
  }).join('');
}
function jumpRefCard(idx) {
  refCardIndex = idx;
  loadRefCard(idx);
  document.getElementById('rs-flash')?.scrollIntoView({ behavior:'smooth', block:'start' });
}

// ── 执裁日志 ──
function setRefRating(val, btn) {
  refCurrentRating = val;
  document.querySelectorAll('.rs-rating-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}
function submitRefLog() {
  const date = document.getElementById('rs-log-date')?.value;
  const tag = document.getElementById('rs-log-tag')?.value.trim();
  const title = document.getElementById('rs-log-title')?.value.trim();
  const text = document.getElementById('rs-log-text')?.value.trim();
  if (!title || !text) { showRefToast('请填写标题和内容'); return; }
  const chips = '执裁日志' + (refCurrentRating ? ',评分' + ['','😞','😐','🙂','😊','🔥'][refCurrentRating] : '');
  saveRefLogToStore(date || new Date().toISOString().split('T')[0], title, text, tag || '执裁日志', chips, refCurrentRating);
  // 清空表单
  if (document.getElementById('rs-log-title')) document.getElementById('rs-log-title').value = '';
  if (document.getElementById('rs-log-text')) document.getElementById('rs-log-text').value = '';
  if (document.getElementById('rs-log-tag')) document.getElementById('rs-log-tag').value = '';
  document.querySelectorAll('.rs-rating-btn').forEach(b => b.classList.remove('selected'));
  refCurrentRating = 0;
}
function renderRefLogs() {
  const list = document.getElementById('rs-log-list');
  if (!list) return;
  const logs = getRefLogsFromStore();
  const ovEl = document.getElementById('rs-log-overview-count');
  if (ovEl) ovEl.textContent = logs.length + ' 场次';
  if (!logs.length) {
    list.innerHTML = '<div class="rs-empty">完成比赛后记录在这里，积累越多进步越快</div>';
    return;
  }
  list.innerHTML = logs.slice(0, 20).map(log => `
    <div class="rs-log-entry">
      <div class="rs-log-meta">
        <span class="rs-log-date">${(log.date||'').replace(/-/g,' · ')}</span>
        ${log.tag ? `<span class="rs-log-tag">${log.tag}</span>` : ''}
      </div>
      <div class="rs-log-title-text">${log.title}</div>
      ${log.text ? `<div class="rs-log-text">${log.text.substring(0,150)}${log.text.length>150?'...':''}</div>` : ''}
    </div>
  `).join('');
}
function renderRefRecentLog() {
  const logs = getRefLogsFromStore();
  const el = document.getElementById('rs-recent-log');
  if (!el) return;
  const ovEl = document.getElementById('rs-log-overview-count');
  if (ovEl) ovEl.textContent = logs.length + ' 场次';
  if (!logs.length) {
    el.innerHTML = '<div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:8px">最近记录</div><div class="rs-empty">完成比赛后在执裁日志里记录</div>';
    return;
  }
  const log = logs[0];
  el.innerHTML = `
    <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:8px">最近记录</div>
    <div class="rs-log-entry">
      <div class="rs-log-meta">
        <span class="rs-log-date">${(log.date||'').replace(/-/g,' · ')}</span>
        ${log.tag ? `<span class="rs-log-tag">${log.tag}</span>` : ''}
      </div>
      <div class="rs-log-title-text">${log.title}</div>
      ${log.text ? `<div class="rs-log-text">${log.text.substring(0,120)}${log.text.length>120?'...':''}</div>` : ''}
    </div>`;
}
function updateRefOverviewCount() {
  updateRefCardStats();
  const logs = getRefLogsFromStore();
  const ovEl = document.getElementById('rs-log-overview-count');
  if (ovEl) ovEl.textContent = logs.length + ' 场次';
}
function showRefToast(msg) {
  const t = document.getElementById('rs-toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

function loadFitData(){try{return JSON.parse(localStorage.getItem(FIT_KEY)||'{"sessions":[]}')}catch(e){return{sessions:[]}}}

  return FIT_CSS+`<div class="fit-wrap">

  </div>
</div>`;}

function buildFitMetricsHTML(){
  return FIT_CSS+`<div class="fit-wrap">
  <div class="fit-fc">
    <div class="fit-ft">记录今日指标</div>
    <div class="fit-fg"><label class="fit-lbl">日期</label><input type="date" class="fit-inp" id="fit-m-date"></div>
    <div class="fit-mgrid">
      <div class="fit-mi"><label class="fit-lbl">体重</label><div class="fit-mwrap"><input type="number" class="fit-mnum" id="fit-weight" placeholder="70" step="0.1"><span class="fit-munit">kg</span></div></div>
      <div class="fit-mi"><label class="fit-lbl">体脂率</label><div class="fit-mwrap"><input type="number" class="fit-mnum" id="fit-bodyfat" placeholder="18" step="0.1"><span class="fit-munit">%</span></div></div>
      <div class="fit-mi"><label class="fit-lbl">胸围</label><div class="fit-mwrap"><input type="number" class="fit-mnum" id="fit-chest" placeholder="90" step="0.5"><span class="fit-munit">cm</span></div></div>
      <div class="fit-mi"><label class="fit-lbl">腰围</label><div class="fit-mwrap"><input type="number" class="fit-mnum" id="fit-waist" placeholder="75" step="0.5"><span class="fit-munit">cm</span></div></div>
      <div class="fit-mi"><label class="fit-lbl">臂围</label><div class="fit-mwrap"><input type="number" class="fit-mnum" id="fit-arm" placeholder="35" step="0.5"><span class="fit-munit">cm</span></div></div>
      <div class="fit-mi"><label class="fit-lbl">大腿围</label><div class="fit-mwrap"><input type="number" class="fit-mnum" id="fit-thigh" placeholder="55" step="0.5"><span class="fit-munit">cm</span></div></div>
    </div>
    <button class="fit-sbtn" style="margin-top:12px" onclick="submitFitMetrics()">保存指标</button>

  <div class="fit-stitle">历史记录</div>
  <div id="fit-metrics-list"></div>
</div>`;}

let fitSelectedParts=[];

function initFitTab(tab){
  const today=new Date().toISOString().split('T')[0];
  if(tab==='log'){
    const d=document.getElementById('fit-date');if(d)d.value=today;
    fitSelectedParts=[];renderPartBtns();
    const er=document.getElementById('fit-ex-rows');if(er)er.innerHTML='';
    addFitExRow();renderFitSessions();
  }else{
    const d=document.getElementById('fit-m-date');if(d)d.value=today;
    renderFitMetrics();
  }
}

function renderPartBtns(){
  const row=document.getElementById('fit-part-row');if(!row)return;
  row.innerHTML=FIT_PARTS.map(p=>`<button class="fit-pb${fitSelectedParts.includes(p)?' on':''}" style="${fitSelectedParts.includes(p)?'background:'+PART_COLORS[p]:''}" onclick="toggleFitPart('${p}',this)">${p}</button>`).join('');
}

function toggleFitPart(part,btn){
  const i=fitSelectedParts.indexOf(part);
  if(i>-1){fitSelectedParts.splice(i,1);btn.classList.remove('on');btn.style.background='';}
  else{fitSelectedParts.push(part);btn.classList.add('on');btn.style.background=PART_COLORS[part]||'#888';}
}

function addFitExRow(){
  const exList=loadExercises();
  const container=document.getElementById('fit-ex-rows');if(!container)return;
  const rowId='ex-'+Date.now();
  const exOpts=exList.map(e=>`<option value="${e.id}">${e.name}（${e.part}）</option>`).join('');
  const div=document.createElement('div');
  div.className='fit-exrow';div.dataset.rid=rowId;
  div.innerHTML=`<div class="fit-exrow-top">
    <select class="fit-exsel" onchange="refreshSets(this)">${exOpts}</select>
    <button class="fit-exdel" onclick="this.closest('.fit-exrow').remove()">×</button>
  </div>
  <div class="fit-setrows" id="sr-${rowId}">${buildSetRow(rowId,1,exList[0])}</div>
  <button class="fit-addset" onclick="moreSet('${rowId}',this.closest('.fit-exrow').querySelector('select'))">+ 加一组</button>`;
  container.appendChild(div);
}

function buildSetRow(rid,n,ex){
  const unit=ex?ex.unit:'kg';
  const needWeight=unit!=='次'&&unit!=='秒'&&unit!=='分钟';
  return `<div class="fit-setrow">
    <span class="fit-setlbl">第${n}组</span>
    <input type="number" class="fit-setinp" placeholder="${needWeight?'次':'数量'}" min="1" style="max-width:44px">
    <span class="fit-setlbl">${needWeight?'次':unit}</span>
    ${needWeight?`<input type="number" class="fit-setinp" placeholder="0" min="0" step="2.5" style="max-width:52px"><span class="fit-setlbl">kg</span>`:''}
  </div>`;}

function refreshSets(sel){
  const exList=loadExercises();const ex=exList.find(e=>e.id===sel.value);
  const row=sel.closest('.fit-exrow');const rid=row.dataset.rid;
  const sr=document.getElementById('sr-'+rid);if(sr)sr.innerHTML=buildSetRow(rid,1,ex);
}

function moreSet(rid,sel){
  const exList=loadExercises();const ex=exList.find(e=>e.id===sel.value);
  const sr=document.getElementById('sr-'+rid);if(!sr)return;
  const n=sr.children.length+1;sr.insertAdjacentHTML('beforeend',buildSetRow(rid,n,ex));
}

function submitFitSession(){
  const date=document.getElementById('fit-date')?.value;
  const note=document.getElementById('fit-note')?.value.trim();
  if(!fitSelectedParts.length){showFitToast('请选择训练部位');return;}
  const exercises=[];
  document.querySelectorAll('#fit-ex-rows .fit-exrow').forEach(row=>{
    const sel=row.querySelector('.fit-exsel');if(!sel)return;
    const exList=loadExercises();const ex=exList.find(e=>e.id===sel.value);
    const sets=[];
    row.querySelectorAll('.fit-setrow').forEach(sr=>{
      const ins=sr.querySelectorAll('.fit-setinp');
      const reps=ins[0]?.value;const weight=ins[1]?.value;
      if(reps)sets.push({reps,weight:weight||''});
    });
    if(ex&&sets.length)exercises.push({name:ex.name,part:ex.part,unit:ex.unit,sets});
  });
  if(!exercises.length){showFitToast('请添加至少一个动作');return;}
  const data=loadFitData();
  data.sessions.unshift({id:Date.now()+'_'+Math.random().toString(36).slice(2),date:date||new Date().toISOString().split('T')[0],parts:[...fitSelectedParts],exercises,note});
  saveFitData(data);updateStats();
  fitSelectedParts=[];renderPartBtns();
  document.getElementById('fit-ex-rows').innerHTML='';addFitExRow();
  const fn=document.getElementById('fit-note');if(fn)fn.value='';
  renderFitSessions();showFitToast('已保存');
}

function renderFitSessions(){
  const list=document.getElementById('fit-session-list');if(!list)return;
  const data=loadFitData();
  if(!data.sessions.length){list.innerHTML='<div class="fit-empty">还没有训练记录</div>';return;}
  list.innerHTML=data.sessions.map(s=>{
    const pc=s.parts.map(p=>`<span class="fit-sc-part" style="background:${PART_COLORS[p]||'#888'}">${p}</span>`).join('');
    const exs=s.exercises.map(e=>{
      const st=e.sets.map((t,i)=>{
        let tx=`第${i+1}组 ${t.reps}${e.unit==='kg'?'次':''}`;
        if(t.weight)tx+=`×${t.weight}kg`;return tx;
      }).join('　');
      return `<div class="fit-sc-ex"><span class="fit-sc-exname">${e.name}</span><span class="fit-sc-sets">${st}</span></div>`;
    }).join('');
    return `<div class="fit-sc"><div class="fit-sc-head"><span class="fit-sc-date">${(s.date||'').replace(/-/g,' · ')}</span><div style="display:flex;gap:4px;flex-wrap:wrap">${pc}</div><button class="fit-sc-del" onclick="deleteFitSession('${s.id}')">删除</button></div><div class="fit-sc-exs">${exs}</div>${s.note?`<div class="fit-sc-note">${s.note}</div>`:''}</div>`;
  }).join('');
}

function deleteFitSession(id){
  if(!confirm('确认删除？'))return;
  const data=loadFitData();data.sessions=data.sessions.filter(s=>s.id!==id);
  saveFitData(data);updateStats();renderFitSessions();
}

function openExManage(){document.getElementById('fit-manage-ov').classList.add('open');renderExLib();}
function closeExManage(){
  document.getElementById('fit-manage-ov').classList.remove('open');
  document.getElementById('fit-ex-rows').innerHTML='';addFitExRow();
}
function renderExLib(){
  const list=document.getElementById('fit-ex-lib-list');if(!list)return;
  const exList=loadExercises();
  list.innerHTML=exList.map(e=>`<div class="fit-ellib-item"><span class="fit-ellib-name">${e.name}</span><span class="fit-ellib-part" style="color:${PART_COLORS[e.part]||'#888'}">${e.part}</span><button class="fit-ellib-del" onclick="deleteExFromLib('${e.id}')">×</button></div>`).join('');
}
function addExToLib(){
  const name=document.getElementById('new-ex-name')?.value.trim();
  const part=document.getElementById('new-ex-part')?.value;
  if(!name){showFitToast('请输入名称');return;}
  const exList=loadExercises();
  if(exList.find(e=>e.name===name)){showFitToast('已存在');return;}
  const unit=part==='有氧'?'分钟':part==='核心'?'次':'kg';
  exList.push({id:'e'+Date.now(),name,part,unit});
  saveExercises(exList);document.getElementById('new-ex-name').value='';
  renderExLib();showFitToast('已添加');
}
function deleteExFromLib(id){
  if(!confirm('确认删除？'))return;
  saveExercises(loadExercises().filter(e=>e.id!==id));renderExLib();
}

function submitFitMetrics(){
  const date=document.getElementById('fit-m-date')?.value||new Date().toISOString().split('T')[0];
  const vals={weight:document.getElementById('fit-weight')?.value,bodyfat:document.getElementById('fit-bodyfat')?.value,chest:document.getElementById('fit-chest')?.value,waist:document.getElementById('fit-waist')?.value,arm:document.getElementById('fit-arm')?.value,thigh:document.getElementById('fit-thigh')?.value};
  if(!Object.values(vals).some(Boolean)){showFitToast('请至少填写一项');return;}
  const metrics=loadFitMetrics();metrics.unshift({id:Date.now()+'',date,...vals});
  saveFitMetrics(metrics);
  Object.keys(vals).forEach(k=>{const el=document.getElementById('fit-'+k);if(el)el.value='';});
  renderFitMetrics();showFitToast('已保存');
}

function renderFitMetrics(){
  const list=document.getElementById('fit-metrics-list');if(!list)return;
  const metrics=loadFitMetrics();
  if(!metrics.length){list.innerHTML='<div class="fit-empty">还没有指标记录</div>';return;}
  const labels={weight:'体重',bodyfat:'体脂%',chest:'胸围',waist:'腰围',arm:'臂围',thigh:'腿围'};
  const units={weight:'kg',bodyfat:'%',chest:'cm',waist:'cm',arm:'cm',thigh:'cm'};
  list.innerHTML=metrics.map(m=>`<div class="fit-mc"><div class="fit-mc-head"><span class="fit-mc-date">${(m.date||'').replace(/-/g,' · ')}</span><button class="fit-mc-del" onclick="deleteFitMetric('${m.id}')">×</button></div><div class="fit-mc-vals">${Object.entries(labels).filter(([k])=>m[k]).map(([k,l])=>`<div class="fit-mc-val"><div class="fit-mc-n">${m[k]}</div><div class="fit-mc-l">${l}${units[k]}</div></div>`).join('')}</div></div>`).join('');
}

function deleteFitMetric(id){
  if(!confirm('确认删除？'))return;
  saveFitMetrics(loadFitMetrics().filter(m=>m.id!==id));renderFitMetrics();
}

function showFitToast(msg){
  let t=document.getElementById('fit-toast');
  if(!t){t=document.createElement('div');t.id='fit-toast';t.style.cssText='position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:var(--blue);color:#000;padding:8px 18px;border-radius:20px;font-size:12px;font-weight:700;opacity:0;transition:opacity 0.3s;z-index:999;white-space:nowrap;pointer-events:none;';document.body.appendChild(t);}
  t.textContent=msg;t.style.opacity='1';clearTimeout(t._t);t._t=setTimeout(()=>t.style.opacity='0',2000);
}

</script>
