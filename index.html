<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="篮球手记">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#eef1f7">
<title>Lee 的篮球空间</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+SC:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #eef1f7;
  --surface: #ffffff;
  --surface2: #f4f6fb;
  --border: #dde2ee;
  --border2: #c5cce0;
  --green: #00913f;
  --green-dim: #d0f0e0;
  --green-text: #006b2e;
  --purple: #5c2fd6;
  --purple-dim: #ebe5fb;
  --purple-text: #3d1fa0;
  --orange: #d94f00;
  --orange-dim: #fde8d8;
  --orange-text: #a03a00;
  --text: #111827;
  --text2: #374151;
  --text3: #6b7280;
  --white: #111827;
  --radius: 12px;
  --radius-sm: 8px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Noto Sans SC', sans-serif;
  font-weight: 300;
  line-height: 1.6;
  min-height: 100vh;
}

/* ── NOISE OVERLAY ── */
body::before {
  content: '';
  position: fixed;
  inset: 0;
  background-image: none;
  pointer-events: none;
  z-index: 0;
}

/* ── HERO ── */
.hero {
  position: relative;
  padding: 2rem 1.25rem 1.75rem;
  border-bottom: 1px solid var(--border);
  overflow: hidden;
  background: var(--surface);
}
.hero::after {
  content: 'BBALL';
  position: absolute;
  right: -1rem;
  top: 50%;
  transform: translateY(-50%);
  font-family: 'Bebas Neue', sans-serif;
  font-size: 14rem;
  color: rgba(0,145,63,0.06);
  pointer-events: none;
  line-height: 1;
  white-space: nowrap;
}
.hero-eyebrow {
  font-size: 10px;
  letter-spacing: 0.14em;
  color: var(--green);
  font-weight: 500;
  margin-bottom: 0.75rem;
  text-transform: uppercase;
}
.hero-title {
  font-family: 'Bebas Neue', sans-serif;
  font-size: clamp(2.4rem, 10vw, 5rem);
  letter-spacing: 0.04em;
  color: var(--text);
  line-height: 0.95;
}
.hero-title span { color: var(--green); }
.hero-desc {
  margin-top: 0.875rem;
  font-size: 14px;
  color: var(--text2);
  max-width: 420px;
}
.role-pills {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 1rem;
}
.rpill {
  font-size: 12px;
  font-weight: 500;
  padding: 5px 16px;
  border-radius: 99px;
  letter-spacing: 0.04em;
}
.rp-g { background: var(--green-dim); color: var(--green); border: 1px solid rgba(62,240,124,0.2); }
.rp-p { background: var(--purple-dim); color: var(--purple); border: 1px solid rgba(157,127,252,0.2); }
.rp-o { background: var(--orange-dim); color: var(--orange); border: 1px solid rgba(255,123,66,0.2); }

/* ── STATS ── */
.stats {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1px;
  background: var(--border);
  border-bottom: 1px solid var(--border);
}
.stat {
  background: var(--surface);
  padding: 1.125rem 1rem;
  text-align: center;
  transition: background 0.2s;
}
.stat:hover { background: var(--surface2); }
.stat-n {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 2.2rem;
  color: var(--text);
  letter-spacing: 0.02em;
  line-height: 1;
}
.stat-l { font-size: 11px; color: var(--text3); margin-top: 5px; letter-spacing: 0.05em; }

/* ── NAV ── */
.view-nav {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0.75rem 1.25rem;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: rgba(238,241,247,0.97); border-bottom: 1px solid var(--border);
  backdrop-filter: blur(12px);
  z-index: 50;
}
.vnav-btn {
  font-size: 13px;
  font-weight: 500;
  padding: 6px 16px;
  border-radius: 99px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--text2);
  cursor: pointer;
  transition: all 0.18s;
  font-family: 'Noto Sans SC', sans-serif;
  letter-spacing: 0.02em;
}
.vnav-btn:hover { color: var(--text); border-color: var(--border2); }
.vnav-btn.active { background: var(--surface2); color: var(--white); border-color: var(--border2); }
.vnav-sep { flex: 1; }
.add-btn {
  font-size: 12px;
  font-weight: 500;
  padding: 6px 14px;
  border-radius: 99px;
  background: var(--green);
  color: #000;
  border: none;
  cursor: pointer;
  font-family: 'Noto Sans SC', sans-serif;
  transition: opacity 0.18s;
  display: flex;
  align-items: center;
  gap: 5px;
}
.add-btn:hover { opacity: 0.85; }

/* ── MAIN LAYOUT ── */
.main { padding: 1.25rem 1.25rem 6rem; }

/* ── SECTION HEADER ── */
.sec-hd {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.25rem;
  margin-top: 2.5rem;
}
.sec-hd:first-child { margin-top: 0; }
.sec-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
.sec-name { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.06em; color: var(--text); }
.sec-badge {
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid var(--border2);
  color: var(--text3);
  letter-spacing: 0.06em;
}
.sec-divider { height: 1px; background: var(--border); margin: 2.5rem 0; }

/* ── CARD ── */
.entries { display: flex; flex-direction: column; gap: 14px; }
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
  transition: border-color 0.2s;
}
.card:hover { border-color: var(--border2); box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
.card-body { padding: 1rem 1.125rem; }
.card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; flex-wrap: wrap; }
.card-date { font-size: 13px; color: var(--text3); letter-spacing: 0.04em; }
.card-tag {
  font-size: 13px;
  font-weight: 500;
  padding: 2px 9px;
  border-radius: 4px;
  letter-spacing: 0.04em;
}
.card-title { font-size: 17px; font-weight: 500; color: var(--text); margin-bottom: 6px; }
.card-text { font-size: 15px; color: var(--text2); line-height: 1.8; }
.card-chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.chip {
  font-size: 13px;
  padding: 2px 9px;
  border-radius: 4px;
  background: var(--surface2);
  color: var(--text3);
  border: 1px solid var(--border);
}

/* ── MEDIA BLOCK ── */
.media-zone {
  border-top: 1px solid var(--border);
  padding: 0.875rem 1.125rem;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.media-label { font-size: 12px; color: var(--text3); letter-spacing: 0.08em; margin-bottom: 4px; }
.media-row { display: flex; gap: 8px; flex-wrap: wrap; }

/* Video */
.vid-item {
  flex: 1;
  min-width: 180px;
  aspect-ratio: 16/9;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s;
}
.vid-item:hover { border-color: var(--border2); }
.vid-item video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.vid-placeholder { text-align: center; z-index: 1; pointer-events: none; }
.vid-play-btn {
  width: 38px; height: 38px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 7px;
}
.vid-duration { font-size: 11px; color: var(--text2); }
.vid-overlay {
  position: absolute; inset: 0; background: rgba(0,0,0,0.5);
  display: flex; align-items: center; justify-content: center;
  opacity: 0; transition: opacity 0.2s; z-index: 2;
}
.vid-item:hover .vid-overlay { opacity: 1; }

/* Image */
.img-item {
  width: 80px; height: 80px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  overflow: hidden;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  transition: border-color 0.2s;
}
.img-item:hover { border-color: var(--border2); }
.img-item img { width: 100%; height: 100%; object-fit: cover; }
.img-grid { display: flex; gap: 6px; flex-wrap: wrap; }

/* Audio */
.audio-item {
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 10px 14px;
  display: flex;
  align-items: center;
  gap: 12px;
}
.audio-btn {
  width: 30px; height: 30px; border-radius: 50%;
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; transition: opacity 0.2s;
}
.audio-btn:hover { opacity: 0.8; }
.audio-info { flex: 1; min-width: 0; }
.audio-name { font-size: 14px; color: var(--text); font-weight: 500; }
.audio-time { font-size: 12px; color: var(--text3); margin-top: 2px; }
.audio-bar-wrap { flex: 1; min-width: 60px; }
.audio-track {
  height: 3px;
  background: var(--border2);
  border-radius: 2px;
  position: relative;
  cursor: pointer;
}
.audio-prog { height: 3px; border-radius: 2px; width: 0%; transition: width 0.1s; }

/* Upload zones */
.upload-zone {
  border: 1px dashed var(--border2);
  border-radius: var(--radius-sm);
  padding: 12px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 11px;
  color: var(--text3);
  background: var(--surface2);
}
.upload-zone:hover { border-color: var(--text3); color: var(--text2); }
.upload-zone.drag-over { border-color: var(--green); color: var(--green); background: var(--green-dim); }
.upload-btns { display: flex; gap: 6px; flex-wrap: wrap; }
.upl-btn {
  font-size: 12px;
  padding: 5px 10px;
  border-radius: var(--radius-sm);
  border: 1px dashed var(--border2);
  background: var(--surface2);
  color: var(--text3);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 5px;
  transition: all 0.2s;
  font-family: 'Noto Sans SC', sans-serif;
}
.upl-btn:hover { border-color: var(--text3); color: var(--text2); }

/* ── TIMELINE VIEW ── */
.timeline { display: none; }
.timeline.active { display: block; }
.grid-view { display: block; }
.grid-view.hidden { display: none; }

.tl-year { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; color: var(--text); letter-spacing: 0.06em; margin-bottom: 1.5rem; margin-top: 0.5rem; }
.tl-month-group { margin-bottom: 2rem; }
.tl-month-label {
  font-size: 12px;
  letter-spacing: 0.08em;
  color: var(--text3);
  text-transform: uppercase;
  margin-bottom: 1rem;
  padding-left: 1.5rem;
  position: relative;
}
.tl-month-label::before {
  content: '';
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 10px;
  height: 1px;
  background: var(--border2);
}
.tl-items { display: flex; flex-direction: column; gap: 0; }
.tl-item {
  display: flex;
  gap: 0;
  padding-left: 1.5rem;
  position: relative;
}
.tl-item::before {
  content: '';
  position: absolute;
  left: 4px;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--border);
}
.tl-item:last-child::before { bottom: 50%; }
.tl-dot {
  position: absolute;
  left: 0;
  top: 1.2rem;
  width: 9px;
  height: 9px;
  border-radius: 50%;
  border: 1px solid var(--border2);
  background: var(--bg);
  z-index: 1;
  flex-shrink: 0;
}
.tl-card {
  flex: 1;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 0.875rem 1rem;
  margin-bottom: 10px;
  transition: border-color 0.2s;
}
.tl-card:hover { border-color: var(--border2); }
.tl-card-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.tl-card-date { font-size: 11px; color: var(--text3); }
.tl-card-role { font-size: 10px; font-weight: 500; padding: 2px 7px; border-radius: 3px; }
.tl-card-title { font-size: 15px; font-weight: 500; color: var(--text); margin-bottom: 4px; }
.tl-card-text { font-size: 13px; color: var(--text2); line-height: 1.7; }

/* ── MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.8);
  z-index: 100;
  align-items: center;
  justify-content: center;
  padding: 1rem;
}
.modal-overlay.open { display: flex; }
.modal {
  background: var(--surface);
  border: 1px solid var(--border2);
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  border-radius: var(--radius);
  padding: 1.75rem;
  width: 100%;
  max-width: 520px;
  max-height: 90vh;
  overflow-y: auto;
}
.modal-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; color: var(--text); letter-spacing: 0.04em; margin-bottom: 1.25rem; }
.form-group { margin-bottom: 1rem; }
.form-label { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; margin-bottom: 6px; display: block; }
.form-input, .form-select, .form-textarea {
  width: 100%;
  background: var(--surface2);
  border: 1px solid var(--border2);
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--text);
  font-size: 16px;
  -webkit-appearance: none;
  font-family: 'Noto Sans SC', sans-serif;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--green); }
.form-textarea { min-height: 110px; resize: none; line-height: 1.7; }
.form-select option { background: var(--surface2); }
.form-row { display: flex; gap: 10px; }
.form-row .form-group { flex: 1; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 1.25rem; }
.btn-cancel {
  font-size: 13px; padding: 8px 18px; border-radius: 99px;
  border: 1px solid var(--border2); background: transparent;
  color: var(--text2);
  transition: all 0.18s; cursor: pointer; font-family: 'Noto Sans SC', sans-serif;
  transition: all 0.18s;
}
.btn-cancel:hover { color: var(--text); }
.btn-submit {
  font-size: 13px; padding: 8px 20px; border-radius: 99px;
  border: none; background: var(--green); color: #000;
  cursor: pointer; font-family: 'Noto Sans SC', sans-serif; font-weight: 500;
  transition: opacity 0.18s;
}
.btn-submit:hover { opacity: 0.85; }

/* ── LIGHTBOX ── */
.lightbox {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.95);
  z-index: 200;
  align-items: center;
  justify-content: center;
}
.lightbox.open { display: flex; }
.lightbox img, .lightbox video {
  max-width: 90vw;
  max-height: 90vh;
  border-radius: var(--radius-sm);
}
.lightbox-close {
  position: absolute;
  top: 1.5rem;
  right: 1.5rem;
  width: 36px; height: 36px;
  border-radius: 50%;
  border: 1px solid #444;
  background: #222;
  color: #ccc;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 18px;
}

/* ── FOOTER ── */
.footer { text-align: center; padding: 2rem; border-top: 1px solid var(--border); }
.footer p { font-size: 11px; color: var(--text3); letter-spacing: 0.06em; }

/* ── SCROLLBAR ── */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }

.role-enter-btn {
  font-family: 'Noto Sans SC', sans-serif;
  cursor: pointer;
  transition: opacity 0.18s, transform 0.15s;
  border: none;
}
.role-enter-btn:hover { opacity: 0.85; transform: translateY(-1px); }

.role-card {
  background: var(--surface);
  border: 1px solid var(--border2);
  border-radius: var(--radius);
  padding: 1.375rem 1.25rem;
  cursor: pointer;
  position: relative;
  overflow: hidden;
  transition: border-color 0.2s, transform 0.15s;
  -webkit-tap-highlight-color: transparent;
}

.role-card-accent { position: absolute; top: 0; left: 0; right: 0; height: 3px; }
.role-card-name { font-family: 'Bebas Neue', sans-serif; font-size: 2rem; letter-spacing: 0.06em; margin-top: 0.5rem; }
.role-card-sub { font-size: 13px; color: var(--text2); margin-top: 4px; }
.role-card-count { font-size: 12px; color: var(--text3); margin-top: 0.875rem; }

.back-btn { color: var(--text2) !important; }
.back-btn:hover { color: var(--text) !important; }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: 1.75rem;
  right: 1.25rem;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--green);
  color: #fff;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 16px rgba(0,145,63,0.35);
  z-index: 40;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s, box-shadow 0.15s;
}
.fab:active { transform: scale(0.93); box-shadow: 0 2px 8px rgba(0,145,63,0.25); }

/* ── TOUCH TARGETS ── */
.vnav-btn { min-height: 36px; min-width: 44px; }
.upl-btn { min-height: 40px; padding: 8px 12px; }
.chip { padding: 4px 10px; }
.rpill { padding: 7px 18px; }

/* ── MODAL mobile ── */
@media (max-width: 600px) {
  .modal-overlay { align-items: flex-end; padding: 0; }
  .modal {
    border-radius: 16px 16px 0 0;
    max-height: 92vh;
    padding: 1.5rem 1.25rem 2rem;
    border-bottom: none;
  }
  .modal-title { font-size: 1.3rem; }
}

/* ── AUDIO item mobile ── */
.audio-name { font-size: 14px; font-weight: 500; }
.audio-time { font-size: 12px; color: var(--text3); margin-top: 2px; }

/* ── HORIZONTAL ROLE CARDS ── */
.role-card {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0;
  overflow: hidden;
  border-radius: var(--radius);
  border: 1px solid var(--border);
  background: var(--surface);
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.12s;
}
.role-card:active { transform: scale(0.98); }
.rcard-left {
  width: 72px;
  min-height: 80px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  align-self: stretch;
}
.rcard-icon {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 1.3rem;
  letter-spacing: 0.06em;
  writing-mode: horizontal-tb;
  font-size: 1.1rem;
}
.rcard-right {
  flex: 1;
  padding: 0.875rem 0.875rem 0.875rem 1rem;
  min-width: 0;
}
.rcard-title { font-size: 16px; font-weight: 500; margin-bottom: 3px; }
.rcard-desc { font-size: 12px; color: var(--text3); line-height: 1.5; }
.rcard-count { font-size: 12px; color: var(--text3); margin-top: 8px; }
.rcard-arrow {
  font-size: 22px;
  color: var(--border2);
  padding-right: 1rem;
  flex-shrink: 0;
  font-weight: 300;
}

/* ── CARD ACTIONS ── */
.card-meta { position: relative; }
.card-actions {
  margin-left: auto;
  display: flex;
  gap: 2px;
  opacity: 0;
  transition: opacity 0.15s;
}
.card:hover .card-actions, .card:focus-within .card-actions { opacity: 1; }
@media (max-width: 768px) { .card-actions { opacity: 1; } }
.card-action-btn {
  width: 30px; height: 30px;
  border-radius: 6px;
  border: none;
  background: transparent;
  color: var(--text3);
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  transition: background 0.15s, color 0.15s;
}
.card-action-btn:hover, .card-action-btn:active { background: var(--surface2); color: var(--text); }
.card-delete-btn:hover, .card-delete-btn:active { background: #fdeade; color: var(--orange); }
</style>
</head>
<body>

<!-- HERO -->
<div class="hero">

<!-- LIGHTBOX -->

  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <div id="lightbox-content"></div>
</div>

<script>
const roleColors = {
  player: { accent: 'var(--green)', dim: 'var(--green-dim)', text: 'var(--green)', label: '球员' },
  coach:  { accent: 'var(--purple)', dim: 'var(--purple-dim)', text: 'var(--purple)', label: '教练' },
  ref:    { accent: 'var(--orange)', dim: 'var(--orange-dim)', text: 'var(--orange)', label: '裁判' }
};

// ── STORAGE ──
const STORE_KEY = 'bball_entries_v1';
const MEDIA_KEY = 'bball_media_v1';

function loadEntries() {
  try { return JSON.parse(localStorage.getItem(STORE_KEY) || '[]'); } catch(e) { return []; }
}
function saveEntries() {
  // save from source containers ONLY, never from display area
  const entries = [];
  ['player','coach','ref'].forEach(role => {
    document.getElementById('entries-'+role).querySelectorAll('.card[data-role]').forEach(card => {
      entries.push({
        id:    card.dataset.id || '',
        role:  card.dataset.role,
        date:  card.dataset.date || '',
        title: card.querySelector('.card-title')?.textContent || '',
        text:  card.querySelector('.card-text')?.textContent || '',
        tag:   card.querySelector('.card-tag')?.textContent || '',
        chips: Array.from(card.querySelectorAll('.chip')).map(c => c.textContent),
      });
    });
  });
  try { localStorage.setItem(STORE_KEY, JSON.stringify(entries)); } catch(e) {}
}
function loadMediaIndex() {
  try { return JSON.parse(localStorage.getItem(MEDIA_KEY) || '{}'); } catch(e) { return {}; }
}
function saveMediaIndex(idx) {
  try { localStorage.setItem(MEDIA_KEY, JSON.stringify(idx)); } catch(e) {}
}

// ── RENDER SAVED ENTRIES ──
function renderSavedEntries() {
  const entries = loadEntries();
  entries.forEach(e => {
    const rc = roleColors[e.role];
    if(!rc) return;
    const fmtDate = (e.date||'').replace(/-/g,' · ');
    const chipHtml = (e.chips||[]).map(c=>`<span class="chip">${c}</span>`).join('');
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.role = e.role;
    card.dataset.date = e.date || '';
    card.dataset.id = e.id || Date.now() + Math.random();
    card.innerHTML = buildCardInner(e.role, fmtDate, e.tag, e.title, e.text, chipHtml);
    attachMediaUploadHandlers(card);
    const container = document.getElementById(`entries-${e.role}`);
    if(container) container.appendChild(card);
    restoreMediaForCard(card);
  });
}

function buildCardInner(role, fmtDate, tag, title, text, chipHtml) {
  const rc = roleColors[role];
  return `
    <div class="card-body">
      <div class="card-meta">
        <span class="card-date">${fmtDate}</span>
        ${tag ? `<span class="card-tag" style="background:${rc.dim};color:${rc.accent}">${tag}</span>` : ''}
        <div class="card-actions">
          <button class="card-action-btn" onclick="editCard(this.closest('.card'))" title="编辑">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M9.5 2.5l2 2L4 12H2v-2L9.5 2.5z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
          </button>
          <button class="card-action-btn card-delete-btn" onclick="deleteCard(this.closest('.card'))" title="删除">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M5 4V2.5h4V4M5.5 6.5v4M8.5 6.5v4M3 4l.8 7.5h6.4L11 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </div>
      </div>
      <div class="card-title">${title}</div>
      <div class="card-text">${text}</div>
      ${chipHtml ? `<div class="card-chips">${chipHtml}</div>` : ''}
    </div>
    <div class="media-zone">
      <div class="media-label">媒体</div>
      <div class="upload-btns">
        <label class="upl-btn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1"/><path d="M4 5l2-2 2 2M6 3v4" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          拍视频 / 选文件
          <input type="file" accept="video/*" capture="environment" style="display:none" onchange="handleMedia(this,'video',this.closest('.card'))">
        </label>
        <label class="upl-btn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><rect x="1" y="2" width="10" height="8" rx="1.5" stroke="currentColor" stroke-width="1"/><circle cx="4" cy="5" r="1" fill="currentColor"/><path d="M1 9l3-3 2 2 2-2 3 3" stroke="currentColor" stroke-width="1" fill="none"/></svg>
          拍照 / 选图片
          <input type="file" accept="image/*" capture="environment" style="display:none" onchange="handleMedia(this,'image',this.closest('.card'))">
        </label>
        <label class="upl-btn">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="5" r="2.5" stroke="currentColor" stroke-width="1"/><path d="M3 10c0-1.7 1.3-3 3-3s3 1.3 3 3" stroke="currentColor" stroke-width="1"/><path d="M6 7.5v2" stroke="currentColor" stroke-width="1" stroke-linecap="round"/></svg>
          录音 / 选音频
          <input type="file" accept="audio/*" style="display:none" onchange="handleMedia(this,'audio',this.closest('.card'))">
        </label>
      </div>
      <div class="media-row" style="margin-top:4px"></div>
    </div>`;
}

function attachMediaUploadHandlers(card) {
  card.querySelectorAll('input[type=file]').forEach(input => {
    const type = input.accept.includes('video') ? 'video' : input.accept.includes('image') ? 'image' : 'audio';
    input.onchange = function() { handleMedia(this, type, this.closest('.card')); };
  });
}

// ── MEDIA PERSISTENCE (base64 for images/audio, skip video) ──
function getCardId(card) {
  if(!card.dataset.id) card.dataset.id = Date.now() + '_' + Math.random().toString(36).slice(2);
  return card.dataset.id;
}
function restoreMediaForCard(card) {
  const idx = loadMediaIndex();
  const id = card.dataset.id;
  if(!id || !idx[id]) return;
  const row = card.querySelector('.media-row');
  idx[id].forEach(m => {
    if(m.type === 'image') {
      const wrap = document.createElement('div');
      wrap.className = 'img-item';
      const img = document.createElement('img');
      img.src = m.data;
      wrap.appendChild(img);
      wrap.onclick = () => openLightbox('img', m.data);
      row.appendChild(wrap);
    } else if(m.type === 'audio') {
      renderAudioItem(row, m.name, m.data);
    }
  });
}
function persistMedia(card, type, name, data) {
  const id = getCardId(card);
  const idx = loadMediaIndex();
  if(!idx[id]) idx[id] = [];
  if(type !== 'video') {
    idx[id].push({ type, name, data });
    saveMediaIndex(idx);
  }
}

// ── STATS ──
function updateStats() {
  // only count from source containers, never from display area
  const p = document.getElementById('entries-player').querySelectorAll('.card[data-role]').length;
  const c = document.getElementById('entries-coach').querySelectorAll('.card[data-role]').length;
  const r = document.getElementById('entries-ref').querySelectorAll('.card[data-role]').length;
  document.getElementById('cnt-player').textContent = p;
  document.getElementById('cnt-coach').textContent = c;
  document.getElementById('cnt-ref').textContent = r;
  document.getElementById('cnt-total').textContent = p+c+r;
}

// ── INIT ──
renderSavedEntries();
if(!localStorage.getItem(STORE_KEY)) saveEntries();
updateStats();
updateHomeCount();

// ── ROLE NAVIGATION ──
let currentRole = null;

function enterRole(role) {
  currentRole = role;
  const rc = roleColors[role];
  const roleNames = { player: '练球日志', coach: '教练手记', ref: '裁判笔记' };

  document.getElementById('home-view').style.display = 'none';
  document.getElementById('role-view').style.display = 'block';
  document.getElementById('role-nav').style.display = 'flex';
  document.getElementById('fab-btn').style.display = 'flex';
  document.getElementById('role-nav-title').textContent = roleNames[role];
  document.getElementById('role-nav-title').style.color = rc.accent;
  document.getElementById('tab-entries').classList.add('active');
  document.getElementById('tab-timeline').classList.remove('active');

  // 裁判专属tab显示/隐藏
  const refTab = document.getElementById('tab-ref-system');
  if (refTab) refTab.style.display = role === 'ref' ? '' : 'none';
  if (role === 'ref') refTab.classList.remove('active');

  // 球员专属tab显示/隐藏
  const fitTab = document.getElementById('tab-fitness');
  if (fitTab) fitTab.style.display = role === 'player' ? '' : 'none';
  if (role === 'player') fitTab.classList.remove('active');

  renderRoleEntries(role);
  window.scrollTo(0, 0);
}

function exitRole() {
  currentRole = null;
  document.getElementById('home-view').style.display = 'block';
  document.getElementById('role-view').style.display = 'none';
  document.getElementById('role-nav').style.display = 'none';
  document.getElementById('fab-btn').style.display = 'none';
  const refTab = document.getElementById('tab-ref-system');
  if (refTab) { refTab.style.display = 'none'; refTab.classList.remove('active'); }
  const fitTab = document.getElementById('tab-fitness');
  if (fitTab) { fitTab.style.display = 'none'; fitTab.classList.remove('active'); }
  updateHomeCount();
}

function renderRoleEntries(role) {
  // sync store from source containers (not display)
  syncStoreFromDOM();

  const display = document.getElementById('role-entries-display');
  const empty = document.getElementById('role-empty');
  const tlDisplay = document.getElementById('role-timeline-display');

  display.style.display = 'flex';
  tlDisplay.style.display = 'none';
  display.innerHTML = '';

  // get entries for this role from store, sorted newest first
  const entries = Object.values(entryStore)
    .filter(e => e.role === role)
    .sort((a,b) => (b.date||'').localeCompare(a.date||''));

  if(entries.length === 0) {
    empty.style.display = 'block';
    display.style.display = 'none';
    return;
  }
  empty.style.display = 'none';

  entries.forEach(e => {
    const rc = roleColors[e.role];
    const fmtDate = (e.date||'').replace(/-/g,' · ');
    const chipHtml = (e.chips||[]).map(c=>`<span class="chip">${c}</span>`).join('');
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.role = e.role;
    card.dataset.date = e.date || '';
    card.dataset.id = e.id;
    card.innerHTML = buildCardInner(e.role, fmtDate, e.tag, e.title, e.text, chipHtml);
    attachMediaUploadHandlers(card);
    restoreMediaForCard(card);
    display.appendChild(card);
  });
}

function switchTab(tab) {
  document.getElementById('tab-entries').classList.toggle('active', tab === 'entries');
  document.getElementById('tab-timeline').classList.toggle('active', tab === 'timeline');
  const refTab = document.getElementById('tab-ref-system');
  if (refTab) refTab.classList.toggle('active', tab === 'ref-system');
  const fitTab = document.getElementById('tab-fitness');
  if (fitTab) fitTab.classList.toggle('active', tab === 'fitness');

  const display = document.getElementById('role-entries-display');
  const tlDisplay = document.getElementById('role-timeline-display');
  const empty = document.getElementById('role-empty');
  const refPanel = document.getElementById('ref-system-panel');
  const fitPanel = document.getElementById('fitness-panel');
  const fab = document.getElementById('fab-btn');

  // 执裁精进面板
  if (tab === 'ref-system') {
    display.style.display = 'none';
    tlDisplay.style.display = 'none';
    empty.style.display = 'none';
    refPanel.style.display = 'block';
    fitPanel.style.display = 'none';
    fab.style.display = 'none';
    if (!refPanel.dataset.loaded) { buildRefSystem(); refPanel.dataset.loaded = '1'; }
    return;
  }

  // 健身面板
  if (tab === 'fitness') {
    display.style.display = 'none';
    tlDisplay.style.display = 'none';
    empty.style.display = 'none';
    refPanel.style.display = 'none';
    fitPanel.style.display = 'block';
    fab.style.display = 'none';
    if (!fitPanel.dataset.loaded) { buildFitnessSystem(); fitPanel.dataset.loaded = '1'; }
    return;
  }

  // 恢复fab
  fab.style.display = 'flex';
  refPanel.style.display = 'none';
  fitPanel.style.display = 'none';

  if (tab === 'timeline') {
    display.style.display = 'none';
    tlDisplay.style.display = 'block';
    empty.style.display = 'none';
    buildRoleTimeline(currentRole);
  } else {
    tlDisplay.style.display = 'none';
    renderRoleEntries(currentRole);
  }
}

function buildRoleTimeline(role) {
  const src = document.getElementById('entries-' + role);
  const cards = Array.from(src.querySelectorAll('.card[data-role]'));
  const tlDisplay = document.getElementById('role-timeline-display');
  if(!cards.length) { tlDisplay.innerHTML = '<p style="color:var(--text3);font-size:13px;padding:2rem 0">还没有记录</p>'; return; }
  const byMonth = {};
  cards.forEach(card => {
    const d = card.dataset.date || '2024-01-01';
    const [y,m] = d.split('-');
    const key = `${y}-${m}`;
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(card);
  });
  const months = Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
  const monthNames = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  const rc = roleColors[role];
  let html = '';
  let lastYear = '';
  months.forEach(key => {
    const [y,m] = key.split('-');
    if(y !== lastYear) { html += `<div class="tl-year">${y}</div>`; lastYear = y; }
    html += `<div class="tl-month-group"><div class="tl-month-label">${monthNames[parseInt(m)]||m}</div><div class="tl-items">`;
    byMonth[key].forEach(card => {
      const title = card.querySelector('.card-title')?.textContent || '';
      const text = card.querySelector('.card-text')?.textContent || '';
      const date = (card.dataset.date||'').replace(/-/g,' · ');
      html += `<div class="tl-item">
        <div class="tl-dot" style="border-color:${rc.accent}"></div>
        <div class="tl-card">
          <div class="tl-card-top"><span class="tl-card-date">${date}</span></div>
          <div class="tl-card-title">${title}</div>
          <div class="tl-card-text">${text.substring(0,100)}${text.length>100?'…':''}</div>
        </div>
      </div>`;
    });
    html += '</div></div>';
  });
  tlDisplay.innerHTML = html;
}

function updateHomeCount() {
  ['player','coach','ref'].forEach(role => {
    const n = document.getElementById('entries-'+role).querySelectorAll('.card[data-role]').length;
    const el = document.getElementById('home-cnt-'+role);
    if(el) el.textContent = n + ' 条记录';
  });
}

// ── TIMELINE ──
function buildTimeline() {
  const cards = Array.from(document.querySelectorAll('.card[data-role]'));
  if(!cards.length) { document.getElementById('timeline-content').innerHTML = '<p style="color:var(--text3);font-size:13px">暂无记录</p>'; return; }
  const byMonth = {};
  cards.forEach(card => {
    const d = card.dataset.date || '2024-01-01';
    const [y,m] = d.split('-');
    const key = `${y}-${m}`;
    if(!byMonth[key]) byMonth[key] = [];
    byMonth[key].push(card);
  });
  const months = Object.keys(byMonth).sort((a,b)=>b.localeCompare(a));
  const monthNames = ['','一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
  let html = '';
  let lastYear = '';
  months.forEach(key => {
    const [y,m] = key.split('-');
    if(y !== lastYear) { html += `<div class="tl-year">${y}</div>`; lastYear = y; }
    const monthLabel = monthNames[parseInt(m)] || m;
    html += `<div class="tl-month-group"><div class="tl-month-label">${monthLabel}</div><div class="tl-items">`;
    byMonth[key].forEach(card => {
      const role = card.dataset.role;
      const rc = roleColors[role];
      const title = card.querySelector('.card-title')?.textContent || '';
      const text = card.querySelector('.card-text')?.textContent || '';
      const date = (card.dataset.date||'').replace(/-/g,' · ');
      html += `<div class="tl-item">
        <div class="tl-dot" style="border-color:${rc.accent}"></div>
        <div class="tl-card">
          <div class="tl-card-top">
            <span class="tl-card-date">${date}</span>
            <span class="tl-card-role" style="background:${rc.dim};color:${rc.accent}">${rc.label}</span>
          </div>
          <div class="tl-card-title">${title}</div>
          <div class="tl-card-text">${text.substring(0,80)}${text.length>80?'…':''}</div>
        </div>
      </div>`;
    });
    html += '</div></div>';
  });
  document.getElementById('timeline-content').innerHTML = html;
}

// ── MODAL ──
function openModal() {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('f-date').value = today;
  if(currentRole) document.getElementById('f-role').value = currentRole;
  document.getElementById('modal-overlay').classList.add('open');
}
function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
  delete document.getElementById('modal-overlay').dataset.editId;
  document.getElementById('modal-title').textContent = '新建记录';
  ['f-tag','f-title','f-text','f-chips'].forEach(id => document.getElementById(id).value = '');

// ── EDIT CARD ──
// ── IN-MEMORY ENTRY STORE (single source of truth) ──
let entryStore = {}; // id -> {id, role, date, tag, title, text, chips:[]}

function syncStoreFromDOM() {
  entryStore = {};
  ['player','coach','ref'].forEach(r => {
    document.getElementById('entries-'+r).querySelectorAll('.card[data-role]').forEach(card => {
      const id = card.dataset.id;
      if(!id) return;
      entryStore[id] = {
        id,
        role: card.dataset.role,
        date: card.dataset.date || '',
        tag:   card.querySelector('.card-tag')?.textContent || '',
        title: card.querySelector('.card-title')?.textContent || '',
        text:  card.querySelector('.card-text')?.textContent || '',
        chips: Array.from(card.querySelectorAll('.chip')).map(c=>c.textContent),
      };
    });
  });
}

function editCard(card) {
  // always read from store, not from DOM clone
  syncStoreFromDOM();
  const id = card.dataset.id;
  const entry = entryStore[id];
  if(!entry) return;

  document.getElementById('f-date').value = entry.date;
  document.getElementById('f-role').value = entry.role;
  document.getElementById('f-tag').value = entry.tag;
  document.getElementById('f-title').value = entry.title;
  document.getElementById('f-text').value = entry.text;
  document.getElementById('f-chips').value = entry.chips.join(', ');

  document.getElementById('modal-overlay').dataset.editId = id;
  document.getElementById('modal-title').textContent = '编辑记录';
  document.getElementById('modal-overlay').classList.add('open');
}

// ── DELETE CARD ──
function deleteCard(card) {
  if(!confirm('确认删除这条记录？')) return;
  const id = card.dataset.id;
  const role = card.dataset.role;

  // remove from source container only (display will refresh)
  ['player','coach','ref'].forEach(r => {
    document.getElementById('entries-'+r).querySelectorAll(`[data-id="${id}"]`).forEach(c => c.remove());
  });

  // remove media
  const idx = loadMediaIndex();
  delete idx[id];
  saveMediaIndex(idx);

  saveEntries();
  updateStats();
  updateHomeCount();
  if(currentRole) renderRoleEntries(currentRole);
  showSaveToast();
}

function submitEntry() {
  const date  = document.getElementById('f-date').value;
  const role  = document.getElementById('f-role').value;
  const tag   = document.getElementById('f-tag').value.trim();
  const title = document.getElementById('f-title').value.trim();
  const text  = document.getElementById('f-text').value.trim();
  const chips = document.getElementById('f-chips').value.trim();
  if(!title||!text) { alert('请填写标题和内容'); return; }

  const fmtDate  = date.replace(/-/g,' · ');
  const chipHtml = chips ? chips.split(',').map(c=>`<span class="chip">${c.trim()}</span>`).join('') : '';
  const editId   = document.getElementById('modal-overlay').dataset.editId;

  if(editId) {
    // ── EDIT: remove old card from ALL source containers, insert updated one ──
    ['player','coach','ref'].forEach(r => {
      document.getElementById('entries-'+r).querySelectorAll(`[data-id="${editId}"]`).forEach(c => c.remove());
    });
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.role = role;
    card.dataset.date = date;
    card.dataset.id   = editId;
    card.innerHTML = buildCardInner(role, fmtDate, tag, title, text, chipHtml);
    attachMediaUploadHandlers(card);
    restoreMediaForCard(card);
    document.getElementById('entries-' + role).prepend(card);
  } else {
    // ── NEW ENTRY ──
    const card = document.createElement('div');
    card.className = 'card';
    card.dataset.role = role;
    card.dataset.date = date;
    card.dataset.id   = Date.now() + '_' + Math.random().toString(36).slice(2);
    card.innerHTML = buildCardInner(role, fmtDate, tag, title, text, chipHtml);
    attachMediaUploadHandlers(card);
    document.getElementById('entries-' + role).prepend(card);
  }

  saveEntries();
  closeModal();
  updateStats();
  updateHomeCount();
  if(currentRole) renderRoleEntries(currentRole);
  showSaveToast();
}

// ── MEDIA UPLOAD ──
function fileToBase64(file) {
  return new Promise((res, rej) => {
    const r = new FileReader();
    r.onload = () => res(r.result);
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

function renderAudioItem(row, name, src) {
  const wrap = document.createElement('div');
  wrap.className = 'audio-item';
  wrap.style.width = '100%';
  const audio = new Audio(src);
  const uid = 'at-' + Date.now() + Math.random().toString(36).slice(2);
  wrap.innerHTML = `
    <button class="audio-btn" style="background:var(--orange)">
      <svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 1.5l7 3.5-7 3.5V1.5z" fill="#000"/></svg>
    </button>
    <div class="audio-info">
      <div class="audio-name">${name}</div>
      <div class="audio-time" id="${uid}">0:00</div>
    </div>
    <div class="audio-bar-wrap">
      <div class="audio-track"><div class="audio-prog" style="background:var(--orange)"></div></div>
    </div>`;
  const btn = wrap.querySelector('.audio-btn');
  const timeEl = wrap.querySelector('.audio-time');
  const progEl = wrap.querySelector('.audio-prog');
  let playing = false;
  const pauseIcon = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><rect x="2" y="1" width="2.5" height="8" rx="1" fill="#000"/><rect x="5.5" y="1" width="2.5" height="8" rx="1" fill="#000"/></svg>';
  const playIcon = '<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 1.5l7 3.5-7 3.5V1.5z" fill="#000"/></svg>';
  btn.onclick = () => {
    if(playing) { audio.pause(); btn.innerHTML = playIcon; }
    else { audio.play(); btn.innerHTML = pauseIcon; }
    playing = !playing;
  };
  audio.ontimeupdate = () => {
    if(audio.duration) {
      progEl.style.width = ((audio.currentTime/audio.duration)*100)+'%';
      const m = Math.floor(audio.currentTime/60);
      const s = Math.floor(audio.currentTime%60).toString().padStart(2,'0');
      timeEl.textContent = `${m}:${s}`;
    }
  };
  audio.onended = () => { playing = false; btn.innerHTML = playIcon; progEl.style.width='0%'; };
  row.appendChild(wrap);
}

async function handleMedia(input, type, card) {
  const files = Array.from(input.files);
  const row = card.querySelector('.media-row');
  for(const file of files) {
    if(type === 'video') {
      const url = URL.createObjectURL(file);
      const wrap = document.createElement('div');
      wrap.className = 'vid-item';
      wrap.style.cssText = 'flex:1;min-width:180px';
      const vid = document.createElement('video');
      vid.src = url; vid.controls = true;
      vid.style.cssText = 'position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:7px';
      wrap.appendChild(vid);
      row.appendChild(wrap);
    } else if(type === 'image') {
      const b64 = await fileToBase64(file);
      const wrap = document.createElement('div');
      wrap.className = 'img-item';
      const img = document.createElement('img');
      img.src = b64;
      wrap.appendChild(img);
      wrap.onclick = () => openLightbox('img', b64);
      row.appendChild(wrap);
      persistMedia(card, 'image', file.name, b64);
    } else if(type === 'audio') {
      const b64 = await fileToBase64(file);
      const name = file.name.replace(/\.[^/.]+$/,'');
      renderAudioItem(row, name, b64);
      persistMedia(card, 'audio', name, b64);
    }
  }
}

// ── TOAST ──
function showSaveToast() {
  let t = document.getElementById('save-toast');
  if(!t) {
    t = document.createElement('div');
    t.id = 'save-toast';
    t.style.cssText = 'position:fixed;bottom:2rem;right:2rem;background:var(--surface);border:1px solid var(--border2);color:var(--green);box-shadow:0 2px 12px rgba(0,0,0,0.12);font-size:12px;padding:8px 16px;border-radius:99px;z-index:300;opacity:0;transition:opacity 0.3s;pointer-events:none;font-family:var(--font-sans)';
    t.textContent = '已自动保存';
    document.body.appendChild(t);
  }
  t.style.opacity = '1';
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.style.opacity = '0', 2000);
}

// ── LIGHTBOX ──
function openLightbox(type, url) {
  const lb = document.getElementById('lightbox');
  const content = document.getElementById('lightbox-content');
  content.innerHTML = type === 'img'
    ? `<img src="${url}" style="max-width:90vw;max-height:90vh;border-radius:8px">`
    : `<video src="${url}" controls style="max-width:90vw;max-height:90vh;border-radius:8px">`;
  lb.classList.add('open');
}
function closeLightbox() {
  document.getElementById('lightbox').classList.remove('open');
  document.getElementById('lightbox-content').innerHTML = '';
}

  const chipArr = chips ? chips.split(',').map(s=>s.trim()).filter(Boolean) : [];
  if (rating) chipArr.unshift('评分' + ['','😞','😐','🙂','😊','🔥'][rating] || '');
  const chipHtml = chipArr.map(c=>`<span class="chip">${c}</span>`).join('');
  const card = document.createElement('div');
  card.className = 'card';
  card.dataset.role = 'ref';
  card.dataset.date = date;
  card.dataset.id = Date.now() + '_' + Math.random().toString(36).slice(2);
  card.innerHTML = buildCardInner('ref', fmtDate, tag, title, text, chipHtml);
  attachMediaUploadHandlers(card);
  document.getElementById('entries-ref').prepend(card);
  saveEntries();
  updateStats();
  updateHomeCount();
  // 刷新执裁精进系统的日志显示
  renderRefLogs();
  showRefToast('✅ 记录已保存到大系统');
}

      <div class="rs-key">时间和距离原则：防守方至少留出对手1个正常步骤的空间来停止或改变方向，距离要求与对手速度成正比。</div>

        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fde8d8;color:#a03a00;font-size:9px">③</div><div class="rs-pos-desc" style="font-size:12px"><strong style="color:#a03a00">转换防守中不必要接触</strong>：防守方为阻止快攻推进（进攻方开始投篮动作前），造成不必要接触。<br><span style="color:var(--text3);font-size:11px">→ 校园比赛最常漏判</span></div></div>

      <div class="rs-warn">累计2次违体，或1技术+1违体，或2技术 = 取消比赛资格（离场）。</div>

      <div class="rs-text">球在向下飞行轨迹中被防守方触及 = 干涉得分违例，进球得分有效。</div>
      <div class="rs-sec-title">进攻方违例（干扰得分）</div>
      <div class="rs-text">进攻方在球的下落轨迹中触及球（除非球明显不会进篮）= 干扰得分违例，进球无效。</div>

        <span style="color:#e05040">●</span> <strong>中央（C）</strong>：罚球线延长线，通常在弱侧<br><br>
        核心理念：尽可能让两名裁判（前导+追踪）落位于球侧，提高决策准确性。

    <div class="rs-tech-body">
      <div class="rs-key">轮转成功三要素：① 适当的发动点（矩形2区）② 适当的时机（球移至弱侧）③ 适当的技巧（预测、急速走动、毫不犹豫）</div>

        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fff3e8;color:#a03a00">阶2</div><div><div class="rs-pos-desc">球移至弱侧（矩形2区之外）</div><div class="rs-pos-note">前导停留1秒（"一次呼吸"）分析弱侧是否立即有投篮/突破。若会→停留不轮转；若不会→发动轮转。同时追踪开始移向新中央位置。</div></div></div>
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fff3e8;color:#a03a00">阶3</div><div><div class="rs-pos-desc">前导完成轮转，到达新球侧</div><div class="rs-pos-note">中央一直执裁球直到前导准备好接管，然后中央向后退（45度面向球篮）移至新追踪位置。</div></div></div>
        <div class="rs-pos-row"><div class="rs-pos-who" style="background:#fff3e8;color:#a03a00">阶4</div><div><div class="rs-pos-desc">中断轮转的条件</div><div class="rs-pos-note">弱侧突然突破/投篮：前导停止轮转返回。横传球到另一侧：前导停止返回球侧。前导越过篮板或禁区中点后=不可返回的点，必须完成轮转。</div></div></div>

function switchRefTab(tab, btn) {
  document.querySelectorAll('.rs-tab').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  else {
    const map = {overview:0,rules:1,tech:2,cards:3,log:4};
    const tabs = document.querySelectorAll('.rs-tab');
    if (tabs[map[tab]]) tabs[map[tab]].classList.add('active');
  }
  document.querySelectorAll('.rs-section').forEach(s => s.classList.remove('active'));
  const target = document.getElementById('rs-' + tab);
  if (target) target.classList.add('active');
  if (tab === 'overview') { renderRefRecentLog(); updateRefOverviewCount(); }
  if (tab === 'log') renderRefLogs();
  if (tab === 'cards') { loadRefCard(refCardIndex); renderRefCardList(); updateRefCardStats(); }
}

// ── 卡片系统 ──
function getRefFilteredCards() {
  if (refCardFilter === 'all') return REF_CARDS;
  return REF_CARDS.filter(c => c.cat === refCardFilter);
}
function loadRefCard(idx) {
  const cards = getRefFilteredCards();
  if (!cards.length) return;
  const card = cards[idx % cards.length];
  const typeEl = document.getElementById('rs-flash-type');
  const qEl = document.getElementById('rs-flash-q');
  const aEl = document.getElementById('rs-flash-a');
  if (typeEl) typeEl.textContent = card.type;
  if (qEl) qEl.textContent = card.q;
  if (aEl) aEl.textContent = card.a;
  const inner = document.getElementById('rs-flash-inner');
  if (inner) inner.classList.remove('flipped');
  updateRefCardStats();
}
function flipRefCard() {
  const inner = document.getElementById('rs-flash-inner');
  if (inner) inner.classList.toggle('flipped');
}
function nextRefCard() {
  const cards = getRefFilteredCards();
  refCardIndex = (refCardIndex + 1) % cards.length;
  loadRefCard(refCardIndex);
}
function markRefCard(correct) {
  const cards = getRefFilteredCards();
  const card = cards[refCardIndex % cards.length];
  refCardStatus[card.id] = correct ? 'right' : 'wrong';
  saveRefCardStatus();
  showRefToast(correct ? '✅ 已标记为掌握' : '❌ 已标记为需复习');
  updateRefCardStats();
  renderRefCardList();
  setTimeout(() => nextRefCard(), 400);
}
function updateRefCardStats() {
  const done = Object.values(refCardStatus).filter(v => v === 'right').length;
  const wrong = Object.values(refCardStatus).filter(v => v === 'wrong').length;
  const totalEl = document.getElementById('rs-total');
  const doneEl = document.getElementById('rs-done');
  const wrongEl = document.getElementById('rs-wrong');
  const prog = document.getElementById('rs-progress');
  if (totalEl) totalEl.textContent = REF_CARDS.length;
  if (doneEl) doneEl.textContent = done;
  if (wrongEl) wrongEl.textContent = wrong;
  if (prog) prog.style.width = (done / REF_CARDS.length * 100) + '%';
  const ovEl = document.getElementById('rs-card-overview-count');
  if (ovEl) ovEl.textContent = `${done}/${REF_CARDS.length} 已掌握`;
}
function filterRefCards(cat, btn) {
  refCardFilter = cat;
  refCardIndex = 0;
  document.querySelectorAll('.rs-cfbtn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  loadRefCard(0);
  renderRefCardList();
}
function renderRefCardList() {
  const cards = getRefFilteredCards();
  const list = document.getElementById('rs-card-list');
  if (!list) return;
  list.innerHTML = cards.map((card, i) => {
    const status = refCardStatus[card.id];
    const icon = status === 'right' ? '✅' : status === 'wrong' ? '❌' : '○';
    return `<div class="rs-card-list-item" onclick="jumpRefCard(${i})">
      <span style="font-size:14px">${icon}</span>
      <div style="flex:1">
        <div style="font-size:10px;color:var(--text3);margin-bottom:2px">${card.type}</div>
        <div style="font-size:12px;color:var(--text);line-height:1.4">${card.q.substring(0,48)}${card.q.length>48?'...':''}</div>
      </div>
    </div>`;
  }).join('');
}
function jumpRefCard(idx) {
  refCardIndex = idx;
  loadRefCard(idx);
  document.getElementById('rs-flash')?.scrollIntoView({ behavior:'smooth', block:'start' });
}

// ── 执裁日志 ──
function setRefRating(val, btn) {
  refCurrentRating = val;
  document.querySelectorAll('.rs-rating-btn').forEach(b => b.classList.remove('selected'));
  btn.classList.add('selected');
}
function submitRefLog() {
  const date = document.getElementById('rs-log-date')?.value;
  const tag = document.getElementById('rs-log-tag')?.value.trim();
  const title = document.getElementById('rs-log-title')?.value.trim();
  const text = document.getElementById('rs-log-text')?.value.trim();
  if (!title || !text) { showRefToast('请填写标题和内容'); return; }
  const chips = '执裁日志' + (refCurrentRating ? ',评分' + ['','😞','😐','🙂','😊','🔥'][refCurrentRating] : '');
  saveRefLogToStore(date || new Date().toISOString().split('T')[0], title, text, tag || '执裁日志', chips, refCurrentRating);
  // 清空表单
  if (document.getElementById('rs-log-title')) document.getElementById('rs-log-title').value = '';
  if (document.getElementById('rs-log-text')) document.getElementById('rs-log-text').value = '';
  if (document.getElementById('rs-log-tag')) document.getElementById('rs-log-tag').value = '';
  document.querySelectorAll('.rs-rating-btn').forEach(b => b.classList.remove('selected'));
  refCurrentRating = 0;
}
function renderRefLogs() {
  const list = document.getElementById('rs-log-list');
  if (!list) return;
  const logs = getRefLogsFromStore();
  const ovEl = document.getElementById('rs-log-overview-count');
  if (ovEl) ovEl.textContent = logs.length + ' 场次';
  if (!logs.length) {
    list.innerHTML = '<div class="rs-empty">完成比赛后记录在这里，积累越多进步越快</div>';
    return;
  }
  list.innerHTML = logs.slice(0, 20).map(log => `
    <div class="rs-log-entry">
      <div class="rs-log-meta">
        <span class="rs-log-date">${(log.date||'').replace(/-/g,' · ')}</span>
        ${log.tag ? `<span class="rs-log-tag">${log.tag}</span>` : ''}
      </div>
      <div class="rs-log-title-text">${log.title}</div>
      ${log.text ? `<div class="rs-log-text">${log.text.substring(0,150)}${log.text.length>150?'...':''}</div>` : ''}
    </div>
  `).join('');
}
function renderRefRecentLog() {
  const logs = getRefLogsFromStore();
  const el = document.getElementById('rs-recent-log');
  if (!el) return;
  const ovEl = document.getElementById('rs-log-overview-count');
  if (ovEl) ovEl.textContent = logs.length + ' 场次';
  if (!logs.length) {
    el.innerHTML = '<div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:8px">最近记录</div><div class="rs-empty">完成比赛后在执裁日志里记录</div>';
    return;
  }
  const log = logs[0];
  el.innerHTML = `
    <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:8px">最近记录</div>
    <div class="rs-log-entry">
      <div class="rs-log-meta">
        <span class="rs-log-date">${(log.date||'').replace(/-/g,' · ')}</span>
        ${log.tag ? `<span class="rs-log-tag">${log.tag}</span>` : ''}
      </div>
      <div class="rs-log-title-text">${log.title}</div>
      ${log.text ? `<div class="rs-log-text">${log.text.substring(0,120)}${log.text.length>120?'...':''}</div>` : ''}
    </div>`;
}
function updateRefOverviewCount() {
  updateRefCardStats();
  const logs = getRefLogsFromStore();
  const ovEl = document.getElementById('rs-log-overview-count');
  if (ovEl) ovEl.textContent = logs.length + ' 场次';
}
function showRefToast(msg) {
  const t = document.getElementById('rs-toast');
  if (!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}

      <label class="ft-form-label">日期</label>
      <input type="date" class="ft-form-input" id="ft-date">
    </div>
    <div class="ft-form-group">
      <label class="ft-form-label">训练部位</label>
      <div class="ft-part-select" id="ft-part-select"></div>
    </div>
    <div class="ft-form-group">
      <label class="ft-form-label">动作记录 <span style="color:var(--text3);font-weight:300">（组数 × 次数 / 重量kg）</span></label>
      <div class="ft-exercises" id="ft-exercises"></div>
      <button class="ft-add-ex-btn" onclick="addExerciseRow()">+ 添加动作</button>
    </div>
    <div class="ft-form-group">
      <label class="ft-form-label">备注感受</label>
      <textarea class="ft-form-textarea" id="ft-note" placeholder="今天状态如何、有什么收获或问题…"></textarea>
    </div>
    <button class="ft-submit-btn" onclick="submitFitSession()">保存训练记录</button>
  </div>
  <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:10px">历史记录</div>
  <div id="ft-session-list"><div class="ft-empty">还没有训练记录</div></div>
</div>

<!-- 身体指标 -->
<div class="ft-section" id="ft-metrics">
  <div class="ft-metric-form">
    <div class="ft-form-title">记录今日指标</div>
    <div class="ft-metric-row">
      <div class="ft-metric-group">
        <div class="ft-metric-label">体重</div>
        <div class="ft-metric-input-wrap">
          <input type="number" class="ft-metric-input" id="ft-weight" placeholder="70" step="0.1">
          <span class="ft-metric-unit">kg</span>
        </div>
      </div>
      <div class="ft-metric-group">
        <div class="ft-metric-label">体脂率</div>
        <div class="ft-metric-input-wrap">
          <input type="number" class="ft-metric-input" id="ft-bodyfat" placeholder="18" step="0.1">
          <span class="ft-metric-unit">%</span>
        </div>
      </div>
    </div>
    <div class="ft-metric-row">
      <div class="ft-metric-group">
        <div class="ft-metric-label">胸围</div>
        <div class="ft-metric-input-wrap">
          <input type="number" class="ft-metric-input" id="ft-chest" placeholder="90" step="0.5">
          <span class="ft-metric-unit">cm</span>
        </div>
      </div>
      <div class="ft-metric-group">
        <div class="ft-metric-label">腰围</div>
        <div class="ft-metric-input-wrap">
          <input type="number" class="ft-metric-input" id="ft-waist" placeholder="75" step="0.5">
          <span class="ft-metric-unit">cm</span>
        </div>
      </div>
    </div>
    <div class="ft-metric-row">
      <div class="ft-metric-group">
        <div class="ft-metric-label">臂围</div>
        <div class="ft-metric-input-wrap">
          <input type="number" class="ft-metric-input" id="ft-arm" placeholder="35" step="0.5">
          <span class="ft-metric-unit">cm</span>
        </div>
      </div>
      <div class="ft-metric-group">
        <div class="ft-metric-label">大腿围</div>
        <div class="ft-metric-input-wrap">
          <input type="number" class="ft-metric-input" id="ft-thigh" placeholder="55" step="0.5">
          <span class="ft-metric-unit">cm</span>
        </div>
      </div>
    </div>
    <div class="ft-form-group" style="margin-top:4px">
      <label class="ft-form-label">日期</label>
      <input type="date" class="ft-form-input" id="ft-metric-date">
    </div>
    <button class="ft-submit-btn" onclick="submitMetrics()">保存指标</button>
  </div>
  <div style="font-size:11px;font-weight:700;letter-spacing:2px;color:var(--text3);margin-bottom:10px">历史记录</div>
  <div id="ft-metrics-list"><div class="ft-empty">还没有指标记录</div></div>
</div>

</div>
<div class="ft-toast" id="ft-toast"></div>
`;
}

let selectedParts = [];

function initFitnessEvents() {
  // 日期默认今天
  const today = new Date().toISOString().split('T')[0];
  const d = document.getElementById('ft-date');
  if(d) d.value = today;
  const md = document.getElementById('ft-metric-date');
  if(md) md.value = today;

  // 部位选择按钮
  const partSelect = document.getElementById('ft-part-select');
  if(partSelect) {
    partSelect.innerHTML = FIT_PARTS.map(p =>
      `<button class="ft-part-btn" style="" onclick="toggleFitPart('${p}',this)">${p}</button>`
    ).join('');
  }

  // 默认一行动作
  addExerciseRow();

  renderFitOverview();
  renderFitSessions();
  renderMetrics();
}

function switchFitTab(tab, btn) {
  document.querySelectorAll('.ft-tab').forEach(b => b.classList.remove('active'));
  if(btn) btn.classList.add('active');
  document.querySelectorAll('.ft-section').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('ft-' + tab);
  if(el) el.classList.add('active');
  if(tab === 'overview') renderFitOverview();
  if(tab === 'log') renderFitSessions();
  if(tab === 'metrics') renderMetrics();
}

function toggleFitPart(part, btn) {
  const idx = selectedParts.indexOf(part);
  if(idx > -1) {
    selectedParts.splice(idx, 1);
    btn.classList.remove('selected');
    btn.style.background = '';
    btn.style.borderColor = '';
    btn.style.color = '';
  } else {
    selectedParts.push(part);
    btn.classList.add('selected');
    btn.style.background = FIT_COLORS[part] || '#888';
    btn.style.borderColor = 'transparent';
    btn.style.color = '#fff';
  }
}

function addExerciseRow() {
  const container = document.getElementById('ft-exercises');
  if(!container) return;
  const row = document.createElement('div');
  row.className = 'ft-exercise-row';
  row.innerHTML = `
    <input class="ft-form-input ft-ex-name" placeholder="动作名称" style="flex:1;padding:6px 8px;font-size:13px">
    <input type="number" class="ft-ex-sets" placeholder="组" min="1">
    <input type="number" class="ft-ex-reps" placeholder="次" min="1">
    <input type="number" class="ft-ex-weight" placeholder="kg" min="0" step="2.5">
    <button class="ft-ex-del" onclick="this.closest('.ft-exercise-row').remove()">×</button>`;
  container.appendChild(row);
}

function submitFitSession() {
  const date = document.getElementById('ft-date')?.value;
  const note = document.getElementById('ft-note')?.value.trim();
  if(!selectedParts.length) { showFitToast('请选择训练部位'); return; }

  const exercises = [];
  document.querySelectorAll('#ft-exercises .ft-exercise-row').forEach(row => {
    const name = row.querySelector('.ft-ex-name')?.value.trim();
    const sets = row.querySelector('.ft-ex-sets')?.value;
    const reps = row.querySelector('.ft-ex-reps')?.value;
    const weight = row.querySelector('.ft-ex-weight')?.value;
    if(name) exercises.push({ name, sets: sets||'', reps: reps||'', weight: weight||'' });
  });

  const data = loadFitData();
  data.sessions.unshift({
    id: Date.now() + '_' + Math.random().toString(36).slice(2),
    date: date || new Date().toISOString().split('T')[0],
    parts: [...selectedParts],
    exercises,
    note,
  });
  saveFitData(data);

  // reset form
  selectedParts = [];
  document.querySelectorAll('#ft-part-select .ft-part-btn').forEach(b => {
    b.classList.remove('selected');
    b.style.background = '';
    b.style.borderColor = '';
    b.style.color = '';
  });
  document.getElementById('ft-exercises').innerHTML = '';
  addExerciseRow();
  if(document.getElementById('ft-note')) document.getElementById('ft-note').value = '';

  renderFitSessions();
  renderFitOverview();
  showFitToast('✅ 训练记录已保存');
}

function renderFitSessions() {
  const list = document.getElementById('ft-session-list');
  if(!list) return;
  const data = loadFitData();
  if(!data.sessions.length) { list.innerHTML = '<div class="ft-empty">还没有训练记录</div>'; return; }
  list.innerHTML = data.sessions.map(s => {
    const color = FIT_COLORS[s.parts[0]] || '#888';
    const partLabel = s.parts.join(' · ');
    const exRows = s.exercises.map(e => {
      let detail = '';
      if(e.sets) detail += e.sets + '组';
      if(e.reps) detail += ' × ' + e.reps + '次';
      if(e.weight) detail += ' · ' + e.weight + 'kg';
      return `<div class="ft-session-ex-row"><span class="ft-session-ex-name">${e.name}</span><span>${detail}</span></div>`;
    }).join('');
    return `<div class="ft-session-card">
      <div class="ft-session-top">
        <span class="ft-session-date">${(s.date||'').replace(/-/g,' · ')}</span>
        <span class="ft-session-part" style="background:${color}">${partLabel}</span>
        <button class="ft-session-del" onclick="deleteFitSession('${s.id}')">删除</button>
      </div>
      ${exRows ? `<div class="ft-session-exercises">${exRows}</div>` : ''}
      ${s.note ? `<div class="ft-session-note">${s.note}</div>` : ''}
    </div>`;
  }).join('');
}

function deleteFitSession(id) {
  if(!confirm('确认删除这条记录？')) return;
  const data = loadFitData();
  data.sessions = data.sessions.filter(s => s.id !== id);
  saveFitData(data);
  renderFitSessions();
  renderFitOverview();
  showFitToast('已删除');
}

function renderFitOverview() {
  const data = loadFitData();
  const total = data.sessions.length;
  const thisMonth = new Date().toISOString().slice(0,7);
  const monthCount = data.sessions.filter(s => (s.date||'').startsWith(thisMonth)).length;
  const el = document.getElementById('ft-total-sessions');
  if(el) el.textContent = total;
  const mel = document.getElementById('ft-this-month');
  if(mel) mel.textContent = monthCount;

  // part summary
  const partCount = {};
  data.sessions.forEach(s => s.parts.forEach(p => { partCount[p] = (partCount[p]||0)+1; }));
  const summary = document.getElementById('ft-part-summary');
  if(summary) {
    summary.innerHTML = Object.entries(partCount).sort((a,b)=>b[1]-a[1]).map(([p,n]) =>
      `<span class="ft-part-chip" style="background:${FIT_COLORS[p]||'#888'};color:#fff">${p} ${n}</span>`
    ).join('');
  }

  // recent 3
  const recent = document.getElementById('ft-recent-list');
  if(!recent) return;
  if(!data.sessions.length) { recent.innerHTML = '<div class="ft-empty">还没有训练记录</div>'; return; }
  recent.innerHTML = data.sessions.slice(0,3).map(s => {
    const color = FIT_COLORS[s.parts[0]] || '#888';
    return `<div class="ft-session-card">
      <div class="ft-session-top">
        <span class="ft-session-date">${(s.date||'').replace(/-/g,' · ')}</span>
        <span class="ft-session-part" style="background:${color}">${s.parts.join(' · ')}</span>
      </div>
      ${s.exercises.slice(0,2).map(e=>`<div style="font-size:12px;color:var(--text2);margin-top:3px">${e.name}${e.sets?' · '+e.sets+'组':''}</div>`).join('')}
    </div>`;
  }).join('');
}

// ── 训练计划 ──
const WEEK_DAYS = ['周一','周二','周三','周四','周五','周六','周日'];

function renderFitPlan() {
  const data = loadFitData();
  const grid = document.getElementById('ft-plan-grid');
  if(!grid) return;
  grid.innerHTML = WEEK_DAYS.map((day, i) => {
    const plan = data.plans[i] || null;
    const chips = plan ? plan.parts.map(p =>
      `<span class="ft-plan-chip" style="background:${FIT_COLORS[p]||'#888'}">${p}</span>`
    ).join('') : '';
    return `<div class="ft-plan-card" onclick="editFitPlan(${i})">
      <div class="ft-plan-day">${day}</div>
      <div class="ft-plan-name">${plan ? plan.name : '休息日'}</div>
      <div class="ft-plan-parts">${chips || '<span style="font-size:11px;color:var(--text3)">点击设置</span>'}</div>
    </div>`;
  }).join('');
}

function editFitPlan(dayIdx) {
  const data = loadFitData();
  const plan = data.plans[dayIdx] || { name:'', parts:[] };
  const area = document.getElementById('ft-plan-edit-area');
  if(!area) return;
  area.style.display = 'block';
  area.innerHTML = `
    <div class="ft-log-form" style="margin-top:10px">
      <div class="ft-form-title">编辑 ${WEEK_DAYS[dayIdx]}</div>
      <div class="ft-form-group">
        <label class="ft-form-label">计划名称</label>
        <input class="ft-form-input" id="ft-plan-name" placeholder="如：胸背日、腿日" value="${plan.name}">
      </div>
      <div class="ft-form-group">
        <label class="ft-form-label">训练部位</label>
        <div class="ft-part-select" id="ft-plan-parts">
          ${FIT_PARTS.map(p => {
            const sel = plan.parts.includes(p);
            return `<button class="ft-part-btn${sel?' selected':''}" style="${sel?'background:'+FIT_COLORS[p]+';color:#fff;border-color:transparent':''}" onclick="togglePlanPart('${p}',this)">${p}</button>`;
          }).join('')}
        </div>
      </div>
      <div style="display:flex;gap:8px">
        <button class="ft-submit-btn" style="background:var(--text3)" onclick="document.getElementById('ft-plan-edit-area').style.display='none'">取消</button>
        <button class="ft-submit-btn" onclick="saveFitPlan(${dayIdx})">保存</button>
      </div>
    </div>`;
  area.scrollIntoView({ behavior:'smooth', block:'start' });
}

let planSelectedParts = [];
function togglePlanPart(part, btn) {
  btn.classList.toggle('selected');
  if(btn.classList.contains('selected')) {
    btn.style.background = FIT_COLORS[part] || '#888';
    btn.style.color = '#fff';
    btn.style.borderColor = 'transparent';
  } else {
    btn.style.background = '';
    btn.style.color = '';
    btn.style.borderColor = '';
  }
}

function saveFitPlan(dayIdx) {
  const name = document.getElementById('ft-plan-name')?.value.trim();
  const parts = Array.from(document.querySelectorAll('#ft-plan-parts .ft-part-btn.selected')).map(b => b.textContent);
  const data = loadFitData();
  if(name || parts.length) {
    data.plans[dayIdx] = { name: name || '训练日', parts };
  } else {
    delete data.plans[dayIdx];
  }
  saveFitData(data);
  document.getElementById('ft-plan-edit-area').style.display = 'none';
  renderFitPlan();
  showFitToast('✅ 计划已保存');
}

// ── 身体指标 ──
function submitMetrics() {
  const date = document.getElementById('ft-metric-date')?.value || new Date().toISOString().split('T')[0];
  const weight = document.getElementById('ft-weight')?.value;
  const bodyfat = document.getElementById('ft-bodyfat')?.value;
  const chest = document.getElementById('ft-chest')?.value;
  const waist = document.getElementById('ft-waist')?.value;
  const arm = document.getElementById('ft-arm')?.value;
  const thigh = document.getElementById('ft-thigh')?.value;
  if(!weight && !bodyfat && !chest && !waist && !arm && !thigh) {
    showFitToast('请至少填写一项指标'); return;
  }
  const metrics = loadMetrics();
  metrics.unshift({ id: Date.now()+'', date, weight, bodyfat, chest, waist, arm, thigh });
  saveMetrics(metrics);
  ['ft-weight','ft-bodyfat','ft-chest','ft-waist','ft-arm','ft-thigh'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.value = '';
  });
  renderMetrics();
  showFitToast('✅ 指标已记录');
}

function renderMetrics() {
  const list = document.getElementById('ft-metrics-list');
  if(!list) return;
  const metrics = loadMetrics();
  if(!metrics.length) { list.innerHTML = '<div class="ft-empty">还没有指标记录</div>'; return; }
  list.innerHTML = metrics.map(m => {
    const vals = [
      m.weight ? `<div class="ft-metric-val"><div class="ft-metric-val-n">${m.weight}</div><div class="ft-metric-val-l">体重kg</div></div>` : '',
      m.bodyfat ? `<div class="ft-metric-val"><div class="ft-metric-val-n">${m.bodyfat}</div><div class="ft-metric-val-l">体脂%</div></div>` : '',
      m.chest ? `<div class="ft-metric-val"><div class="ft-metric-val-n">${m.chest}</div><div class="ft-metric-val-l">胸围cm</div></div>` : '',
      m.waist ? `<div class="ft-metric-val"><div class="ft-metric-val-n">${m.waist}</div><div class="ft-metric-val-l">腰围cm</div></div>` : '',
      m.arm ? `<div class="ft-metric-val"><div class="ft-metric-val-n">${m.arm}</div><div class="ft-metric-val-l">臂围cm</div></div>` : '',
      m.thigh ? `<div class="ft-metric-val"><div class="ft-metric-val-n">${m.thigh}</div><div class="ft-metric-val-l">腿围cm</div></div>` : '',
    ].filter(Boolean).join('');
    return `<div class="ft-metric-card">
      <div class="ft-metric-date">${(m.date||'').replace(/-/g,' · ')}</div>
      <div class="ft-metric-vals">${vals}</div>
      <button class="ft-metric-del" onclick="deleteMetric('${m.id}')">×</button>
    </div>`;
  }).join('');
}

function deleteMetric(id) {
  if(!confirm('确认删除？')) return;
  const metrics = loadMetrics().filter(m => m.id !== id);
  saveMetrics(metrics);
  renderMetrics();
}

function showFitToast(msg) {
  const t = document.getElementById('ft-toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 2000);
}
</script>
